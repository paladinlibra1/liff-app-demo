<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金字塔分段風控計算器 - GAS即時版</title>
    <style>
        :root { --primary: #3b82f6; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; --dark: #1e293b; }
        body { font-family: -apple-system, sans-serif; background: #f1f5f9; padding: 10px; margin: 0; color: #334155; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 15px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        .header { text-align: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; margin-bottom: 20px; }
        .header h2 { margin: 0; font-size: 1.2rem; color: var(--dark); }

        /* GAS 搜尋列 */
        .api-box { display: flex; gap: 8px; background: #f8fafc; padding: 12px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #e2e8f0; }
        .api-box input { flex: 1; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; }
        .api-box button { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .api-box button:disabled { opacity: 0.5; }

        .config-box { background: #eff6ff; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #dbeafe; }
        .config-box label { font-weight: bold; color: var(--primary); font-size: 0.9rem; }
        .config-box input { width: 100%; padding: 12px; margin-top: 5px; border: 2px solid var(--primary); border-radius: 8px; font-size: 1.1rem; font-weight: bold; box-sizing: border-box; }

        .card { background: #fff; border: 1px solid #e2e8f0; padding: 12px; border-radius: 10px; margin-bottom: 15px; border-left: 5px solid #ccc; }
        .card.pos1 { border-left-color: var(--primary); }
        .card.pos2 { border-left-color: var(--warning); }
        .card.pos3 { border-left-color: var(--success); }

        .row { display: flex; gap: 8px; margin-bottom: 8px; }
        .row > div { flex: 1; }
        label { display: block; font-size: 0.75rem; color: #64748b; margin-bottom: 3px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; box-sizing: border-box; }
        
        .tp-box { background: #f0fdf4; border: 1px solid #dcfce7; padding: 15px; border-radius: 10px; margin-bottom: 20px; }

        .result-panel { background: var(--dark); color: white; padding: 20px; border-radius: 12px; margin-top: 20px; }
        .res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .res-item { border-left: 3px solid #334155; padding-left: 10px; }
        .res-label { font-size: 0.75rem; color: #94a3b8; display: block; }
        .res-val { font-size: 1.1rem; font-family: monospace; font-weight: bold; }
        
        .alert-box { grid-column: span 2; text-align: center; padding: 15px; border-radius: 8px; margin-top: 10px; font-weight: bold; font-size: 1.2rem; }
        .safe { background: #065f46; color: #34d399; }
        .danger { background: #991b1b; color: #fca5a5; border: 2px solid #ef4444; }
        .rr-display { text-align: center; margin-top: 15px; color: var(--warning); font-size: 1.5rem; font-weight: 900; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>正金字塔分段風控計算器 (GAS報價版)</h2>
    </div>

    <!-- GAS 報價功能 -->
    <div class="api-box">
        <input type="text" id="stockCode" placeholder="代號: TPE:2330 或 AAPL">
        <button id="fetchBtn" onclick="fetchPrice()">讀取報價</button>
    </div>

    <div class="config-box">
        <label>🎯 計畫最終總持股數</label>
        <input type="number" id="totalQty" placeholder="輸入總量" oninput="distribute()">
    </div>

    <!-- 階段配置 -->
    <div class="card pos1">
        <label>階段 1：底倉 (50%)</label>
        <div class="row">
            <div><label>進場價</label><input type="number" id="p1P" oninput="calc()"></div>
            <div><label>停損價</label><input type="number" id="p1S" oninput="calc()"></div>
            <div><label>股數</label><input type="number" id="p1Q" readonly></div>
        </div>
    </div>

    <div class="card pos2">
        <label>階段 2：加倉 1 (30%)</label>
        <div class="row">
            <div><label>進場價</label><input type="number" id="p2P" oninput="calc()"></div>
            <div><label>停損價</label><input type="number" id="p2S" oninput="calc()"></div>
            <div><label>股數</label><input type="number" id="p2Q" readonly></div>
        </div>
    </div>

    <div class="card pos3">
        <label>階段 3：加倉 2 (20%)</label>
        <div class="row">
            <div><label>進場價</label><input type="number" id="p3P" oninput="calc()"></div>
            <div><label>停損價</label><input type="number" id="p3S" oninput="calc()"></div>
            <div><label>股數</label><input type="number" id="p3Q" readonly></div>
        </div>
    </div>

    <div class="tp-box">
        <label style="color:var(--success)">🎯 最終預計止盈價</label>
        <input type="number" id="tp" placeholder="目標價" oninput="calc()">
    </div>

    <div class="result-panel">
        <div class="res-grid">
            <div class="res-item">
                <span class="res-label">全倉平均成本</span>
                <span id="resAvg" class="res-val">$0</span>
            </div>
            <div class="res-item">
                <span class="res-label">目前總持股</span>
                <span id="resQty" class="res-val">0</span>
            </div>
            <div class="res-item">
                <span class="res-label">達標總獲利</span>
                <span id="resProfit" class="res-val" style="color:var(--success);">$0</span>
            </div>
            <div class="res-item">
                <span class="res-label">全倉停損總損失</span>
                <span id="resLoss" class="res-val">-$0</span>
            </div>

            <div id="alertBox" class="alert-box safe">風險監測：OK (0%)</div>
        </div>
        <div class="rr-display" id="resRR">盈虧比 0 : 1</div>
    </div>
</div>

<script>
// 重要：請在此處填入你的 GAS 部署網址
const GAS_URL = "https://script.google.com/macros/s/AKfycbwayGsRl-souaAe311e1b2SPM4A5SlpudVm_iCzVbsvKU0BcFAG4WOg6O6wBc5IkJaq/exec"; 

async function fetchPrice() {
    const symbol = document.getElementById('stockCode').value.toUpperCase();
    const btn = document.getElementById('fetchBtn');
    if (!symbol) return alert("請輸入代號");

    btn.disabled = true;
    btn.innerText = "讀取中...";

    try {
        const response = await fetch(`${GAS_URL}?symbol=${encodeURIComponent(symbol)}`);
        const data = await response.json();
        
        if (data.price && data.price !== "#N/A") {
            // 自動填入底倉進場價
            document.getElementById('p1P').value = data.price;
            calc();
            alert(`成功獲取 ${symbol} 最新報價：${data.price}`);
        } else {
            alert("讀取失敗，請檢查代號格式 (如台股加 TPE:)");
        }
    } catch (e) {
        alert("網路錯誤或 GAS 設定不正確");
    } finally {
        btn.disabled = false;
        btn.innerText = "讀取報價";
    }
}

function distribute() {
    const total = parseFloat(document.getElementById('totalQty').value) || 0;
    document.getElementById('p1Q').value = Math.floor(total * 0.5);
    document.getElementById('p2Q').value = Math.floor(total * 0.3);
    document.getElementById('p3Q').value = Math.floor(total * 0.2);
    calc();
}

function calc() {
    const data = [
        { p: 'p1P', s: 'p1S', q: 'p1Q' },
        { p: 'p2P', s: 'p2S', q: 'p2Q' },
        { p: 'p3P', s: 'p3S', q: 'p3Q' }
    ];

    let totalCost = 0, totalQty = 0, totalLoss = 0;
    const tp = parseFloat(document.getElementById('tp').value) || 0;

    data.forEach(item => {
        const price = parseFloat(document.getElementById(item.p).value) || 0;
        const stop = parseFloat(document.getElementById(item.s).value) || 0;
        const qty = parseFloat(document.getElementById(item.q).value) || 0;

        if (price > 0) {
            totalCost += price * qty;
            totalQty += qty;
            totalLoss += (price - stop) * qty;
        }
    });

    if (totalQty <= 0) return;

    const avgPrice = totalCost / totalQty;
    const totalProfit = (tp - avgPrice) * totalQty;
    const lossPercentage = (totalLoss / totalCost) * 100;

    document.getElementById('resAvg').innerText = `$${avgPrice.toFixed(2)}`;
    document.getElementById('resQty').innerText = totalQty.toLocaleString();
    document.getElementById('resProfit').innerText = `$${Math.round(totalProfit).toLocaleString()}`;
    document.getElementById('resLoss').innerText = `-$${Math.round(totalLoss).toLocaleString()}`;

    const alertBox = document.getElementById('alertBox');
    if (lossPercentage > 10) {
        alertBox.className = "alert-box danger";
        alertBox.innerText = `⚠️ 風險過高：${lossPercentage.toFixed(2)}%`;
    } else {
        alertBox.className = "alert-box safe";
        alertBox.innerText = `風險正常：${lossPercentage.toFixed(2)}%`;
    }

    if (totalLoss > 0 && totalProfit > 0) {
        document.getElementById('resRR').innerText = `綜合盈虧比 ${(totalProfit / totalLoss).toFixed(2)} : 1`;
    } else {
        document.getElementById('resRR').innerText = `盈虧比 -- : 1`;
    }
}
</script>
</body>
</html>
