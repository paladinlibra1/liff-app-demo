<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金字塔加倉緩衝計算器 - 百分比強化版</title>
    <style>
        :root { --primary: #3b82f6; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; --dark: #1e293b; --buffer: #818cf8; }
        body { font-family: "PingFang TC", sans-serif; background: #f1f5f9; padding: 20px; color: #334155; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        
        .top-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; background: #f8fafc; padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #e2e8f0; }
        input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        .buffer-tag { font-size: 0.75rem; color: var(--buffer); font-weight: bold; margin-top: 4px; display: block; }

        .grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 30px; }
        .input-card { background: #fff; border: 1px solid #e2e8f0; padding: 15px; border-radius: 12px; margin-bottom: 15px; position: relative; }
        .input-card.long { border-left: 5px solid var(--primary); }
        .input-card.exit { border-left: 5px solid var(--success); }
        .input-card.stop { border-left: 5px solid var(--danger); }
        
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; color: #64748b; margin-bottom: 4px; }

        /* 結果顯示 */
        .result-panel { margin-top: 30px; background: var(--dark); color: white; padding: 25px; border-radius: 16px; }
        .res-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .res-item { border-left: 3px solid #334155; padding-left: 15px; }
        .res-val { font-size: 1.3rem; font-family: 'Consolas', monospace; font-weight: bold; display: block; }
        .pct-label { font-size: 0.9rem; font-weight: normal; margin-left: 5px; opacity: 0.8; }
        
        .rr-display { text-align: center; background: #0f172a; padding: 20px; border-radius: 12px; margin-top: 20px; border: 1px solid #1e293b; }
        .rr-val { font-size: 2.8rem; color: var(--warning); font-weight: 900; }
    </style>
</head>
<body>

<div class="container">
    <div style="text-align:center; margin-bottom:20px;">
        <h2>📐 金字塔佈局計算器 (含獲利停損%)</h2>
        <p style="color:#64748b;">自動分配 5:3:2 股數，並即時計算總資產風險與報酬比</p>
    </div>

    <div class="top-bar">
        <div>
            <label>🎯 預計總購買股數</label>
            <input type="number" id="targetTotalQty" placeholder="輸入總股數" oninput="autoDistribute()">
        </div>
        <div>
            <label>⚙️ 設定緩衝百分比 (%)</label>
            <input type="number" id="bufferPct" value="1.5" step="0.1" oninput="calculate()">
        </div>
    </div>

    <div class="grid">
        <!-- 進場配置 -->
        <div class="section">
            <div class="input-card long">
                <label>1. 底倉 (50%)</label>
                <div class="row">
                    <input type="number" id="p1P" placeholder="目標價" oninput="calculate()">
                    <input type="number" id="p1Q" readonly style="background:#f1f5f9;">
                </div>
                <span id="b1" class="buffer-tag">區間: -- ~ --</span>
            </div>
            <div class="input-card long">
                <label>2. 一加 (30%)</label>
                <div class="row">
                    <input type="number" id="p2P" placeholder="目標價" oninput="calculate()">
                    <input type="number" id="p2Q" readonly style="background:#f1f5f9;">
                </div>
                <span id="b2" class="buffer-tag">區間: -- ~ --</span>
            </div>
            <div class="input-card long">
                <label>3. 二加 (20%)</label>
                <div class="row">
                    <input type="number" id="p3P" placeholder="目標價" oninput="calculate()">
                    <input type="number" id="p3Q" readonly style="background:#f1f5f9;">
                </div>
                <span id="b3" class="buffer-tag">區間: -- ~ --</span>
            </div>
        </div>

        <!-- 風控配置 -->
        <div class="section">
            <div class="input-card exit">
                <label>🎯 最終止盈目標</label>
                <input type="number" id="tp" placeholder="目標價" oninput="calculate()">
                <span id="btp" class="buffer-tag">分批止盈區: -- 以上</span>
            </div>
            <div class="input-card stop">
                <label>🚩 第一段停損 (減碼 50%)</label>
                <input type="number" id="sl1P" placeholder="技術止損價" oninput="calculate()">
                <span id="bsl1" class="buffer-tag" style="color:var(--danger);">緩衝防守位: --</span>
            </div>
            <div class="input-card stop">
                <label>💀 最後防守點 (全清)</label>
                <input type="number" id="sl2P" placeholder="絕對止損價" oninput="calculate()">
                <span id="bsl2" class="buffer-tag" style="color:var(--danger);">終極防線: --</span>
            </div>
        </div>
    </div>

    <!-- 結果 -->
    <div class="result-panel">
        <div class="res-grid">
            <div class="res-item">
                <span style="color:#94a3b8; font-size:0.8rem;">平均成本 / 總股數</span>
                <span id="resAvg" class="res-val">-- / 0</span>
            </div>
            <div class="res-item">
                <span style="color:#94a3b8; font-size:0.8rem;">總投入本金</span>
                <span id="resCost" class="res-val">$0</span>
            </div>
            <div class="res-item">
                <span style="color:#94a3b8; font-size:0.8rem;">預期總獲利 (達標)</span>
                <span class="res-val" style="color:var(--success);">
                    <span id="resProfit">$0</span>
                    <span id="resProfitPct" class="pct-label">(0%)</span>
                </span>
            </div>
            <div class="res-item">
                <span style="color:#94a3b8; font-size:0.8rem;">兩段停損總損失</span>
                <span class="res-val" style="color:var(--danger);">
                    <span id="resLoss">$0</span>
                    <span id="resLossPct" class="pct-label">(0%)</span>
                </span>
            </div>
        </div>
        <div class="rr-display">
            <div style="color:#94a3b8; font-size:1rem; margin-bottom:5px;">綜合盈虧比 (盈 : 虧)</div>
            <div id="resRR" class="rr-val">0 : 1</div>
        </div>
    </div>
</div>

<script>
function autoDistribute() {
    const total = parseFloat(document.getElementById('targetTotalQty').value) || 0;
    document.getElementById('p1Q').value = Math.floor(total * 0.5);
    document.getElementById('p2Q').value = Math.floor(total * 0.3);
    document.getElementById('p3Q').value = Math.floor(total * 0.2);
    calculate();
}

function calculate() {
    const bf = (parseFloat(document.getElementById('bufferPct').value) || 0) / 100;
    
    // 進場/止盈/止損緩衝顯示邏輯
    const updateBuffer = (id, tagId, type) => {
        const val = parseFloat(document.getElementById(id).value);
        const tag = document.getElementById(tagId);
        if (val) {
            if (type === 'range') tag.innerText = `掛單區間: ${(val * (1 - bf)).toFixed(2)} ~ ${(val * (1 + bf)).toFixed(2)}`;
            if (type === 'down') tag.innerText = `防禦/緩衝位: ${(val * (1 - bf)).toFixed(2)}`;
            if (type === 'up') tag.innerText = `建議止盈區: ${(val * (1 - bf)).toFixed(2)} 以上`;
        }
    };

    updateBuffer('p1P', 'b1', 'range');
    updateBuffer('p2P', 'b2', 'range');
    updateBuffer('p3P', 'b3', 'range');
    updateBuffer('tp', 'btp', 'up');
    updateBuffer('sl1P', 'bsl1', 'down');
    updateBuffer('sl2P', 'bsl2', 'down');

    // 核心數據計算
    const p1P = parseFloat(document.getElementById('p1P').value) || 0;
    const p1Q = parseFloat(document.getElementById('p1Q').value) || 0;
    const p2P = parseFloat(document.getElementById('p2P').value) || 0;
    const p2Q = parseFloat(document.getElementById('p2Q').value) || 0;
    const p3P = parseFloat(document.getElementById('p3P').value) || 0;
    const p3Q = parseFloat(document.getElementById('p3Q').value) || 0;
    const tp = parseFloat(document.getElementById('tp').value) || 0;
    const sl1 = parseFloat(document.getElementById('sl1P').value) || 0;
    const sl2 = parseFloat(document.getElementById('sl2P').value) || 0;

    const totalQty = p1Q + p2Q + p3Q;

    if (totalQty > 0) {
        const totalCost = (p1P * p1Q) + (p2P * p2Q) + (p3P * p3Q);
        const avgPrice = totalCost / totalQty;
        const totalProfit = (tp - avgPrice) * totalQty;
        
        // 第一段停損預設減碼 50%
        const sl1Qty = totalQty * 0.5;
        const loss1 = (avgPrice - sl1) * sl1Qty;
        const loss2 = (avgPrice - sl2) * (totalQty - sl1Qty);
        const totalLoss = (loss1 > 0 ? loss1 : 0) + (loss2 > 0 ? loss2 : 0);

        // 更新數值與百分比
        document.getElementById('resAvg').innerText = `$${avgPrice.toFixed(2)} / ${totalQty.toLocaleString()}`;
        document.getElementById('resCost').innerText = `$${totalCost.toLocaleString()}`;
        
        document.getElementById('resProfit').innerText = `$${totalProfit.toLocaleString()}`;
        document.getElementById('resProfitPct').innerText = `(${((totalProfit/totalCost)*100).toFixed(2)}%)`;
        
        document.getElementById('resLoss').innerText = `$${totalLoss.toLocaleString()}`;
        document.getElementById('resLossPct').innerText = `(${((totalLoss/totalCost)*100).toFixed(2)}%)`;

        if (totalLoss > 0 && totalProfit > 0) {
            document.getElementById('resRR').innerText = `${(totalProfit / totalLoss).toFixed(2)} : 1`;
        } else {
            document.getElementById('resRR').innerText = "0 : 1";
        }
    }
}
</script>

</body>
</html>
