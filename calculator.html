<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全倉綜效佈局計算器</title>
    <style>
        :root { --primary: #2563eb; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; --dark: #0f172a; }
        body { font-family: -apple-system, sans-serif; background: #f4f7f9; padding: 10px; margin: 0; color: #334155; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h2 { text-align: center; font-size: 1.4rem; color: var(--dark); margin-bottom: 20px; }
        
        .section { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .section-title { font-weight: bold; font-size: 1rem; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; color: var(--primary); }
        
        .row { display: flex; gap: 10px; margin-bottom: 12px; }
        .row > div { flex: 1; }
        label { display: block; font-size: 0.8rem; color: #64748b; margin-bottom: 4px; font-weight: 600; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; box-sizing: border-box; background: #fff; }
        
        /* 結果區域 */
        .result-panel { background: var(--dark); color: white; padding: 20px; border-radius: 12px; margin-top: 20px; }
        .res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .res-item { border-left: 3px solid #334155; padding-left: 12px; }
        .res-label { font-size: 0.75rem; color: #94a3b8; display: block; margin-bottom: 4px; }
        .res-val { font-size: 1.1rem; font-family: 'Consolas', monospace; font-weight: bold; }
        
        .rr-box { 
            margin-top: 15px; padding: 15px; background: #1e293b; border-radius: 8px; text-align: center; 
            border: 1px solid #334155;
        }
        .rr-val { font-size: 2.5rem; color: var(--warning); font-weight: 900; }
        .hint { font-size: 0.75rem; color: #94a3b8; margin-top: 8px; line-height: 1.4; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 全倉綜效佈局計算器</h2>

    <!-- 1. 持倉成本區 -->
    <div class="section">
        <div class="section-title">📥 目前持倉配置 (含底倉與加倉)</div>
        <div class="row">
            <div><label>1. 底倉價</label><input type="number" id="p1P" value="373.5" oninput="calc()"></div>
            <div><label>底倉股數</label><input type="number" id="p1Q" value="200" oninput="calc()"></div>
        </div>
        <div class="row">
            <div><label>2. 加倉價</label><input type="number" id="p2P" value="402.5" oninput="calc()"></div>
            <div><label>加倉股數</label><input type="number" id="p2Q" value="100" oninput="calc()"></div>
        </div>
    </div>

    <!-- 2. 新防守與目標區 -->
    <div class="section" style="border-left: 5px solid var(--danger);">
        <div class="section-title" style="color:var(--danger);">🛡️ 新設定之防守與止盈</div>
        <div class="row">
            <div>
                <label>新停損位 (停損上移)</label>
                <input type="number" id="newSL" value="375" oninput="calc()">
            </div>
            <div>
                <label>最終目標價</label>
                <input type="number" id="newTP" value="463.5" oninput="calc()">
            </div>
        </div>
        <div class="hint">* 當你進入第一次加倉後，將停損點從 345 上移至 375，這會大幅改變你的全倉風險。</div>
    </div>

    <!-- 3. 全倉試算結果 -->
    <div class="result-panel">
        <div class="res-grid">
            <div class="res-item">
                <span class="res-label">全倉總股數</span>
                <span id="totalQty" class="res-val">0</span>
            </div>
            <div class="res-item">
                <span class="res-label">平均成本</span>
                <span id="avgCost" class="res-val">$0</span>
            </div>
            <div class="res-item">
                <span class="res-label">達標總獲利</span>
                <span id="totalProfit" class="res-val" style="color:var(--success);">$0</span>
            </div>
            <div class="res-item">
                <span class="res-label">觸發防守損失</span>
                <span id="totalLoss" class="res-val" style="color:var(--danger);">$0</span>
            </div>
        </div>
        
        <div class="rr-box">
            <span class="res-label" style="color:white;">綜效盈虧比 (盈 : 虧)</span>
            <div id="rrRatio" class="rr-val">0 : 1</div>
        </div>
    </div>
</div>

<script>
function calc() {
    const p1p = parseFloat(document.getElementById('p1P').value) || 0;
    const p1q = parseFloat(document.getElementById('p1Q').value) || 0;
    const p2p = parseFloat(document.getElementById('p2P').value) || 0;
    const p2q = parseFloat(document.getElementById('p2Q').value) || 0;
    
    const newSL = parseFloat(document.getElementById('newSL').value) || 0;
    const newTP = parseFloat(document.getElementById('newTP').value) || 0;

    const totalQty = p1q + p2q;
    if (totalQty <= 0) return;

    const totalCost = (p1p * p1q) + (p2p * p2q);
    const avgCost = totalCost / totalQty;

    // 總獲利 = (目標價 - 平均成本) * 總股數
    const totalProfit = (newTP - avgCost) * totalQty;
    
    // 總損失 = (平均成本 - 新停損位) * 總股數
    // 如果平均成本低於新停損位，則損失為負數（代表即便停損也是賺錢離場）
    const totalLoss = (avgCost - newSL) * totalQty;

    document.getElementById('totalQty').innerText = totalQty.toLocaleString();
    document.getElementById('avgCost').innerText = `$${avgCost.toFixed(2)}`;
    document.getElementById('totalProfit').innerText = `$${Math.round(totalProfit).toLocaleString()}`;
    
    // 如果損失小於 0，代表已經進入「立於不敗之地」
    if (totalLoss <= 0) {
        document.getElementById('totalLoss').innerText = `已保本 (+$${Math.abs(Math.round(totalLoss)).toLocaleString()})`;
        document.getElementById('totalLoss').style.color = "var(--success)";
        document.getElementById('rrRatio').innerText = "∞ : 1";
    } else {
        document.getElementById('totalLoss').innerText = `-$${Math.round(totalLoss).toLocaleString()}`;
        document.getElementById('totalLoss').style.color = "var(--danger)";
        const rr = (totalProfit / totalLoss).toFixed(2);
        document.getElementById('rrRatio').innerText = `${rr} : 1`;
    }
}

// 初始化
window.onload = calc;
</script>

</body>
</html>
