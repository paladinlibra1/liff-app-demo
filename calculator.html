<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金字塔自動分配計算器</title>
    <style>
        :root { --primary: #3b82f6; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; --dark: #1e293b; --border: #e2e8f0; }
        body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; background: #f1f5f9; padding: 20px; color: #334155; }
        .container { max-width: 850px; margin: 0 auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        
        /* 自動分配區 */
        .auto-config { background: #eff6ff; padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #dbeafe; display: flex; align-items: center; gap: 15px; }
        .auto-config h4 { margin: 0; color: var(--primary); white-space: nowrap; }
        
        .grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 25px; }
        .input-card { background: #f8fafc; border: 1px solid var(--border); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        label { display: block; font-size: 0.85rem; font-weight: 600; color: #64748b; margin-bottom: 4px; }
        input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        input.auto-target { border: 2px solid var(--primary); font-size: 1.2rem; font-weight: bold; }

        .result-panel { margin-top: 30px; background: var(--dark); color: white; padding: 25px; border-radius: 16px; }
        .res-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .res-item { border-left: 3px solid #334155; padding-left: 15px; }
        .res-val { font-size: 1.3rem; font-family: 'Consolas', monospace; font-weight: bold; display: block; }
        
        .rr-display { text-align: center; background: #0f172a; padding: 20px; border-radius: 12px; margin-top: 20px; }
        .rr-val { font-size: 2.5rem; color: var(--warning); font-weight: 900; }
    </style>
</head>
<body>

<div class="container">
    <div style="text-align:center; margin-bottom:20px;">
        <h2>📐 金字塔自動分配計算器</h2>
        <p>手動輸入價格，股數由系統自動按 5:3:2 分配</p>
    </div>

    <!-- 自動分配輸入區 -->
    <div class="auto-config">
        <h4>🎯 預計總購買股數</h4>
        <input type="number" id="targetTotalQty" class="auto-target" placeholder="例如: 1000" oninput="autoDistribute()">
        <span style="font-size: 0.85rem; color: #60a5fa;">系統將自動填入下方 50% / 30% / 20% 欄位</span>
    </div>

    <div class="grid">
        <!-- 進場配置 -->
        <div class="section">
            <div class="input-card">
                <label>1. 底倉 (50%)</label>
                <div class="row">
                    <input type="number" id="p1P" placeholder="價格" oninput="calculate()">
                    <input type="number" id="p1Q" placeholder="股數" oninput="calculate()">
                </div>
            </div>
            <div class="input-card">
                <label>2. 一加 (30%)</label>
                <div class="row">
                    <input type="number" id="p2P" placeholder="價格" oninput="calculate()">
                    <input type="number" id="p2Q" placeholder="股數" oninput="calculate()">
                </div>
            </div>
            <div class="input-card">
                <label>3. 二加 (20%)</label>
                <div class="row">
                    <input type="number" id="p3P" placeholder="價格" oninput="calculate()">
                    <input type="number" id="p3Q" placeholder="股數" oninput="calculate()">
                </div>
            </div>
        </div>

        <!-- 風控配置 -->
        <div class="section">
            <div class="input-card" style="border-left: 5px solid var(--success);">
                <label>🎯 最終止盈目標價</label>
                <input type="number" id="tp" placeholder="目標價" oninput="calculate()">
            </div>
            <div class="input-card" style="border-left: 5px solid var(--warning);">
                <label>🚩 第一段停損 (減碼價格/股數)</label>
                <div class="row">
                    <input type="number" id="sl1P" placeholder="價格" oninput="calculate()">
                    <input type="number" id="sl1Q" placeholder="減多少股" oninput="calculate()">
                </div>
            </div>
            <div class="input-card" style="border-left: 5px solid var(--danger);">
                <label>💀 最後防守點 (全清價)</label>
                <input type="number" id="sl2P" placeholder="最後價" oninput="calculate()">
            </div>
        </div>
    </div>

    <!-- 結果 -->
    <div class="result-panel">
        <div class="res-grid">
            <div class="res-item">
                <span style="color:#94a3b8; font-size:0.8rem;">平均成本 / 總股數</span>
                <span id="resAvg" class="res-val">-- / 0</span>
            </div>
            <div class="res-item">
                <span style="color:#94a3b8; font-size:0.8rem;">總投入本金</span>
                <span id="resCost" class="res-val">$0</span>
            </div>
            <div class="res-item">
                <span style="color:#94a3b8; font-size:0.8rem;">預期總獲利</span>
                <span id="resProfit" class="res-val" style="color:var(--success);">$0</span>
            </div>
            <div class="res-item">
                <span style="color:#94a3b8; font-size:0.8rem;">兩段停損總損失</span>
                <span id="resLoss" class="res-val" style="color:var(--danger);">$0</span>
            </div>
        </div>
        <div class="rr-display">
            <div style="color:#94a3b8; font-size:0.9rem; margin-bottom:5px;">綜合盈虧比 (盈 : 虧)</div>
            <div id="resRR" class="rr-val">0 : 1</div>
        </div>
    </div>
</div>

<script>
// 自動分配股數比例 5:3:2
function autoDistribute() {
    const total = parseFloat(document.getElementById('targetTotalQty').value) || 0;
    if (total <= 0) return;

    document.getElementById('p1Q').value = Math.floor(total * 0.5);
    document.getElementById('p2Q').value = Math.floor(total * 0.3);
    document.getElementById('p3Q').value = Math.floor(total * 0.2);
    
    // 預設第一段停損減碼一半，這部分你也可以手動改
    document.getElementById('sl1Q').value = Math.floor(total * 0.5);
    
    calculate(); // 分配完立即試算
}

function calculate() {
    const p1P = parseFloat(document.getElementById('p1P').value) || 0;
    const p1Q = parseFloat(document.getElementById('p1Q').value) || 0;
    const p2P = parseFloat(document.getElementById('p2P').value) || 0;
    const p2Q = parseFloat(document.getElementById('p2Q').value) || 0;
    const p3P = parseFloat(document.getElementById('p3P').value) || 0;
    const p3Q = parseFloat(document.getElementById('p3Q').value) || 0;

    const tp = parseFloat(document.getElementById('tp').value) || 0;
    const sl1P = parseFloat(document.getElementById('sl1P').value) || 0;
    const sl1Q = parseFloat(document.getElementById('sl1Q').value) || 0;
    const sl2P = parseFloat(document.getElementById('sl2P').value) || 0;

    const totalQty = p1Q + p2Q + p3Q;
    if (totalQty <= 0) return;

    const totalCost = (p1P * p1Q) + (p2P * p2Q) + (p3P * p3Q);
    const avgPrice = totalCost / totalQty;

    const totalProfit = (tp - avgPrice) * totalQty;
    const remQty = totalQty - sl1Q;
    const loss1 = (avgPrice - sl1P) * sl1Q;
    const loss2 = (avgPrice - sl2P) * remQty;
    const totalLoss = (loss1 > 0 ? loss1 : 0) + (loss2 > 0 ? loss2 : 0);

    document.getElementById('resAvg').innerText = `$${avgPrice.toFixed(2)} / ${totalQty.toLocaleString()}`;
    document.getElementById('resCost').innerText = `$${totalCost.toLocaleString()}`;
    document.getElementById('resProfit').innerText = `$${totalProfit.toLocaleString()} (${((totalProfit/totalCost)*100).toFixed(2)}%)`;
    document.getElementById('resLoss').innerText = `$${totalLoss.toLocaleString()} (${((totalLoss/totalCost)*100).toFixed(2)}%)`;

    if (totalLoss > 0 && totalProfit > 0) {
        const rr = (totalProfit / totalLoss).toFixed(2);
        document.getElementById('resRR').innerText = `${rr} : 1`;
    } else {
        document.getElementById('resRR').innerText = "0 : 1";
    }
}
</script>

</body>
</html>
