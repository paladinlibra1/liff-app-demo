<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業交易佈局計算器</title>
    <style>
        :root { --primary: #2563eb; --success: #059669; --danger: #dc2626; --bg: #f8fafc; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; }
        .card { background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 450px; }
        h2 { text-align: center; margin-bottom: 1.5rem; color: #1e293b; }
        
        .side-switch { display: flex; background: #edeff2; padding: 4px; border-radius: 8px; margin-bottom: 20px; }
        .side-btn { flex: 1; border: none; padding: 8px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .side-btn.active.long { background: var(--success); color: white; }
        .side-btn.active.short { background: var(--danger); color: white; }
        
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: #64748b; font-weight: 600; }
        input { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; font-size: 1rem; outline: none; }
        input:focus { border-color: var(--primary); ring: 2px solid #bfdbfe; }

        .result-box { margin-top: 20px; padding: 1.5rem; background: #1e293b; color: white; border-radius: 12px; }
        .res-row { display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        .res-row:last-child { border-bottom: none; margin-bottom: 0; }
        .val { font-family: monospace; font-size: 1.1rem; }
        .highlight { color: #60a5fa; font-weight: bold; }
        .defense-text { color: #fbbf24; } /* 警告色，提示防守位 */
    </style>
</head>
<body>

<div class="card">
    <h2>🎯 交易佈局計算器</h2>

    <div class="side-switch">
        <button id="longBtn" class="side-btn active long" onclick="setSide('long')">做多 (Buy)</button>
        <button id="shortBtn" class="side-btn" onclick="setSide('short')">做空 (Sell)</button>
    </div>
    
    <div class="input-grid">
        <div>
            <label>進場價格</label>
            <input type="number" id="entry" placeholder="0.00" oninput="calculate()">
        </div>
        <div>
            <label>本金 (選填)</label>
            <input type="number" id="balance" placeholder="10000" oninput="calculate()">
        </div>
    </div>

    <div class="input-grid">
        <div>
            <label>止盈目標</label>
            <input type="number" id="tp" placeholder="獲利價" oninput="calculate()">
        </div>
        <div>
            <label>止損點 (技術位)</label>
            <input type="number" id="sl" placeholder="原止損價" oninput="calculate()">
        </div>
    </div>

    <div class="input-group">
        <label>防守墊片 (Buffer 點數)</label>
        <input type="number" id="buffer" value="0" placeholder="增加緩衝" oninput="calculate()">
        <small style="color:#94a3b8; font-size: 0.75rem;">* 額外拉開的距離，避免被掃損</small>
    </div>

    <div class="result-box">
        <div class="res-row">
            <span>最終防守位:</span>
            <span id="finalSl" class="val defense-text">--</span>
        </div>
        <div class="res-row">
            <span>盈虧比 (R:R):</span>
            <span id="rr" class="val highlight">0</span>
        </div>
        <div class="res-row">
            <span>預期獲利:</span>
            <span id="profit" class="val" style="color:#4ade80">$0</span>
        </div>
        <div class="res-row">
            <span>預期虧損:</span>
            <span id="loss" class="val" style="color:#f87171">$0</span>
        </div>
    </div>
</div>

<script>
let side = 'long';

function setSide(s) {
    side = s;
    document.getElementById('longBtn').classList.toggle('active', s === 'long');
    document.getElementById('shortBtn').classList.toggle('active', s === 'short');
    calculate();
}

function calculate() {
    const entry = parseFloat(document.getElementById('entry').value);
    const tp = parseFloat(document.getElementById('tp').value);
    const sl = parseFloat(document.getElementById('sl').value);
    const buffer = parseFloat(document.getElementById('buffer').value) || 0;
    const balance = parseFloat(document.getElementById('balance').value) || 0;

    if (!entry || !tp || !sl) return;

    // 計算考慮防守點後的最終止損
    // 做多：止損往下移；做空：止損往上移
    const finalSl = side === 'long' ? sl - buffer : sl + buffer;
    document.getElementById('finalSl').innerText = finalSl.toFixed(4);

    // 計算盈虧點數 (用最終止損算)
    const reward = Math.abs(tp - entry);
    const risk = Math.abs(entry - finalSl);
    
    if (risk === 0) return;

    // 1. 盈虧比
    const rrRatio = (reward / risk).toFixed(2);
    document.getElementById('rr').innerText = `1 : ${rrRatio}`;

    // 2. 金額與百分比
    const rewardPct = reward / entry;
    const riskPct = risk / entry;

    if (balance > 0) {
        document.getElementById('profit').innerText = `+$${(balance * rewardPct).toFixed(2)}`;
        document.getElementById('loss').innerText = `-$${(balance * riskPct).toFixed(2)}`;
    } else {
        document.getElementById('profit').innerText = `${(rewardPct * 100).toFixed(2)}%`;
        document.getElementById('loss').innerText = `${(riskPct * 100).toFixed(2)}%`;
    }
}
</script>

</body>
</html>
