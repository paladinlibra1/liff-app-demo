<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分批進場/止損計算器</title>
    <style>
        :root { --primary: #3b82f6; --success: #22c55e; --danger: #ef4444; --warning: #f59e0b; --gray: #64748b; }
        body { font-family: -apple-system, system-ui, sans-serif; background: #f1f5f9; padding: 20px; color: #1e293b; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-top: 0; color: #0f172a; }
        .section-title { border-left: 4px solid var(--primary); padding-left: 10px; margin: 20px 0 10px; font-weight: bold; }
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 12px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: var(--gray); }
        input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        
        .result-card { background: #1e293b; color: white; padding: 20px; border-radius: 12px; margin-top: 25px; }
        .res-line { display: flex; justify-content: space-between; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #334155; }
        .res-line:last-child { border-bottom: none; margin-bottom: 0; }
        .val { font-family: 'Courier New', monospace; font-weight: bold; }
        .text-green { color: var(--success); }
        .text-red { color: var(--danger); }
        .text-yellow { color: var(--warning); }
        
        .info-tag { font-size: 0.75rem; background: #e2e8f0; padding: 2px 6px; border-radius: 4px; margin-left: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📈 進階交易佈局計算器</h2>

    <!-- 1. 進場設定 -->
    <div class="section-title">進場配置</div>
    <div class="input-row">
        <div>
            <label>進場價格</label>
            <input type="number" id="entryPrice" placeholder="100" oninput="calculate()">
        </div>
        <div>
            <label>總持有股數</label>
            <input type="number" id="totalShares" placeholder="1000" oninput="calculate()">
        </div>
    </div>

    <!-- 2. 止盈設定 -->
    <div class="section-title text-green">止盈目標 (TP)</div>
    <div class="input-row">
        <div>
            <label>預期止盈價</label>
            <input type="number" id="tpPrice" placeholder="120" oninput="calculate()">
        </div>
    </div>

    <!-- 3. 兩段式停損設定 -->
    <div class="section-title text-red">兩段式停損 (SL)</div>
    <div class="input-row">
        <div>
            <label>第一道停損價 (減碼點)</label>
            <input type="number" id="sl1Price" placeholder="95" oninput="calculate()">
        </div>
        <div>
            <label>第一道停損股數</label>
            <input type="number" id="sl1Shares" placeholder="500" oninput="calculate()">
        </div>
    </div>
    <div class="input-row">
        <div>
            <label>最後防守價 (清倉點)</label>
            <input type="number" id="sl2Price" placeholder="90" oninput="calculate()">
        </div>
        <div>
            <label>剩餘股數 (自動計算)</label>
            <input type="number" id="sl2Shares" readonly style="background: #f8fafc;">
        </div>
    </div>

    <!-- 計算結果 -->
    <div class="result-card">
        <div class="res-line">
            <span>總投入成本:</span>
            <span id="resCost" class="val">$0</span>
        </div>
        <div class="res-line">
            <span>達標總獲利:</span>
            <span id="resProfit" class="val text-green">$0</span>
        </div>
        <div class="res-line">
            <span>兩段式停損總損失:</span>
            <span id="resLoss" class="val text-red">$0</span>
        </div>
        <div class="res-line" style="margin-top: 10px; font-size: 1.2rem;">
            <span>綜合盈虧比:</span>
            <span id="resRR" class="val text-yellow">0</span>
        </div>
        <div style="font-size: 0.7rem; color: #94a3b8; margin-top: 10px;">
            * 綜合盈虧比 = 達標總獲利 ÷ 兩段式停損總損失
        </div>
    </div>
</div>

<script>
function calculate() {
    const entry = parseFloat(document.getElementById('entryPrice').value) || 0;
    const totalShares = parseFloat(document.getElementById('totalShares').value) || 0;
    const tpPrice = parseFloat(document.getElementById('tpPrice').value) || 0;
    
    const sl1Price = parseFloat(document.getElementById('sl1Price').value) || 0;
    const sl1Shares = parseFloat(document.getElementById('sl1Shares').value) || 0;
    const sl2Price = parseFloat(document.getElementById('sl2Price').value) || 0;

    // 自動計算剩餘股數 (最後防守點位必須清掉剩下所有的)
    const sl2Shares = Math.max(0, totalShares - sl1Shares);
    document.getElementById('sl2Shares').value = sl2Shares;

    if (entry <= 0 || totalShares <= 0) return;

    // 1. 成本
    const totalCost = entry * totalShares;
    document.getElementById('resCost').innerText = `$${totalCost.toLocaleString()}`;

    // 2. 獲利 (假設全數在 TP 價格賣出)
    const totalProfit = (tpPrice - entry) * totalShares;
    document.getElementById('resProfit').innerText = `$${totalProfit.toLocaleString()} (${((totalProfit/totalCost)*100).toFixed(2)}%)`;

    // 3. 兩段式總損失
    // 損失 = (第一段價差 * 股數) + (第二段價差 * 剩餘股數)
    const loss1 = (entry - sl1Price) * sl1Shares;
    const loss2 = (entry - sl2Price) * sl2Shares;
    const totalLoss = loss1 + loss2;
    
    document.getElementById('resLoss').innerText = `$${totalLoss.toLocaleString()} (${((totalLoss/totalCost)*100).toFixed(2)}%)`;

    // 4. 綜合盈虧比
    if (totalLoss > 0) {
        const rr = (totalProfit / totalLoss).toFixed(2);
        document.getElementById('resRR').innerText = `1 : ${rr}`;
    } else {
        document.getElementById('resRR').innerText = "--";
    }
}
</script>

</body>
</html>
