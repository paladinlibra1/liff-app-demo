<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Colorfashion 庫存盤點</title>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="config.js"></script>

    <style>
        :root {
            --primary-color: #2c2c2c;
            --primary-dark: #000000;
            --bg-color: #f8f8f9;
            --card-bg: #ffffff;
            --text-color: #2b2b2b;
            --border-color: #e5e5e5;
            --accent: #f89fa1;
            --accent-light: #fdf2f5;
            --blue: #3b82f6;
            --blue-light: #eaf2ff;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif; background: var(--bg-color); color: var(--text-color); padding-bottom: calc(90px + env(safe-area-inset-bottom)); }
        .container { max-width: 960px; margin: 0 auto; padding: 20px 16px; }
        h1 { font-size: 22px; margin: 0 0 16px; }

        .tabs { display: inline-flex; gap: 4px; margin-bottom: 20px; background-color: #eeeeee; padding: 6px; border-radius: 14px; overflow-x: auto; white-space: nowrap; max-width: 100%; }
        .tab-btn { background: transparent; border: none; font-size: 15px; font-weight: 600; color: #71717a; cursor: pointer; padding: 10px 18px; border-radius: 10px; transition: all .2s; }
        .tab-btn.active { background-color: white; color: var(--primary-dark); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        .section { display: none; }
        .section.active { display: block; }

        .type-toggle { display: flex; gap: 10px; margin-bottom: 18px; }
        .type-btn { flex: 0 0 auto; padding: 10px 22px; border-radius: 10px; border: 1px solid var(--border-color); background: white; font-size: 16px; font-weight: 600; color: #555; cursor: pointer; }
        .type-btn.active { background: var(--blue-light); border-color: var(--blue); color: var(--blue); }

        .section-label { font-size: 14px; color: #888; margin: 4px 0 8px; }

        .category-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
        .chip-btn { flex: 0 0 auto; padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border-color); background: white; font-size: 13.5px; font-weight: 600; color: #555; cursor: pointer; }
        .chip-btn.active { background: var(--blue-light); border-color: var(--blue); color: var(--blue); }

        .manage-panel { cursor: pointer; }
        .manage-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .manage-row .expand-arrow { font-size: 20px; color: #bbb; transform: rotate(90deg); flex: 0 0 auto; }
        .manage-edit .modal-actions { flex-wrap: wrap; }
        .manage-edit .modal-actions .btn-danger { margin-right: auto; }

        .items-list { display: flex; flex-direction: column; gap: 10px; }
        .series-header { position: sticky; top: 0; background: var(--bg-color); padding: 10px 2px 4px; font-size: 15px; font-weight: 700; color: var(--blue); z-index: 5; }
        .item-panel { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; }
        .item-panel .code { font-weight: 700; font-size: 17px; }
        .item-panel .name { font-size: 14px; color: #666; margin-top: 2px; margin-bottom: 10px; }

        .batch-row { display: flex; align-items: center; gap: 10px; background: white; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; flex-wrap: wrap; }
        .batch-date-row { display: flex; align-items: center; gap: 8px; }
        .batch-qty-row { display: flex; align-items: center; gap: 10px; flex: 1 1 auto; flex-wrap: wrap; }
        .batch-row .expiry-badge { font-size: 13px; padding: 3px 8px; border-radius: 12px; background: #eee; color: #666; white-space: nowrap; }
        .batch-row .expiry-badge.warn { background: #fff3cd; color: #946200; }
        .batch-row .expiry-badge.danger { background: #fde2e2; color: #b02a2a; }
        .batch-row label { font-size: 13px; color: #888; }
        .batch-row .qty-field { display: flex; align-items: center; gap: 4px; }
        .batch-row .qty-input { padding: 8px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 18px; width: 90px; min-height: 40px; font-weight: 700; background: #fafbff; text-align: center; caret-color: transparent; cursor: pointer; }
        .batch-row input[type=date] { padding: 8px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 17px; width: 168px; min-height: 40px; }
        .empty-batch-hint { color: #999; font-size: 14px; background: #fafafa; border: 1px dashed var(--border-color); border-radius: 8px; padding: 12px; text-align: center; margin-bottom: 8px; }
        .batch-row .diff { font-weight: 700; font-size: 15px; min-width: 46px; text-align: center; }
        .batch-row .diff.pos { color: #10b981; }
        .batch-row .diff.neg { color: #d64545; }
        .batch-row .diff.zero { color: #999; }
        .batch-row .remove-batch { margin-left: auto; background: none; border: none; color: #bbb; cursor: pointer; font-size: 20px; padding: 8px; min-width: 40px; min-height: 40px; }

        .btn { border: none; border-radius: 8px; padding: 10px 18px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: var(--primary-color); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-outline { background: white; border: 1px solid var(--border-color); color: #555; }
        .btn-outline:hover { background: #f5f5f5; }
        .btn-danger { background: #d64545; color: white; }
        .btn-add-batch { background: var(--accent-light); color: #c76a70; border: 1px dashed var(--accent); font-size: 14px; padding: 8px 14px; }

        .sticky-bar { position: fixed; left: 0; right: 0; bottom: 0; background: white; border-top: 1px solid var(--border-color); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; box-shadow: 0 -4px 12px rgba(0,0,0,.05); z-index: 20; }
        .sticky-bar input { padding: 8px 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 16px; min-height: 40px; }
        .sticky-bar .count-text { font-size: 14px; color: #666; margin-right: auto; }

        table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #f0f0f0; font-size: 15px; }
        th { background: #fafafa; color: #666; font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: .5px; }
        .btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 6px; }
        .top-action-bar { margin-bottom: 14px; }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); align-items: center; justify-content: center; z-index: 50; padding: 16px; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: white; border-radius: 14px; padding: 22px; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; }
        .modal-box h3 { margin: 0 0 16px; font-size: 17px; }
        .form-row { margin-bottom: 12px; }
        .form-row label { display: block; font-size: 14px; color: #666; margin-bottom: 4px; }
        .form-row input, .form-row select, .form-row textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 16px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

        .keypad-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); align-items: flex-end; justify-content: center; z-index: 60; }
        .keypad-overlay.active { display: flex; }
        .keypad-sheet { background: white; width: 100%; max-width: 420px; border-radius: 18px 18px 0 0; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); box-shadow: 0 -6px 20px rgba(0,0,0,.12); }
        .keypad-header { text-align: center; margin-bottom: 14px; }
        .keypad-label { font-size: 14px; color: #888; margin-bottom: 4px; }
        .keypad-display { font-size: 38px; font-weight: 700; }
        .keypad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
        .keypad-grid button { padding: 18px 0; font-size: 22px; font-weight: 600; border: 1px solid var(--border-color); border-radius: 10px; background: #f7f7f8; color: var(--text-color); cursor: pointer; }
        .keypad-grid button.keypad-fn { background: #eee; color: #555; font-size: 18px; }
        .keypad-confirm { width: 100%; padding: 14px; font-size: 17px; }

        .history-item { background: white; border: 1px solid var(--border-color); border-radius: 10px; padding: 14px; margin-bottom: 10px; cursor: pointer; }
        .history-item .row1 { display: flex; justify-content: space-between; align-items: center; font-size: 15px; }
        .history-item .row1 .diff-tag { font-weight: 700; }
        .history-detail { margin-top: 12px; border-top: 1px dashed var(--border-color); padding-top: 10px; display: none; }
        .history-detail.open { display: block; }
        .history-detail table { font-size: 14px; }

        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--primary-dark); color: white; padding: 10px 20px; border-radius: 8px; font-size: 15px; z-index: 100; opacity: 0; transition: opacity .3s; pointer-events: none; }
        .toast.show { opacity: 1; }

        .empty-hint { color: #aaa; font-size: 15px; padding: 30px 0; text-align: center; }

        @media (max-width: 600px) {
            table, thead, tbody, th, td, tr { display: block; }
            thead { display: none; }
            tr { border: 1px solid var(--border-color); border-radius: 10px; margin-bottom: 10px; padding: 4px 0; }
            td { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid #f5f5f5; }
            td:last-child { border-bottom: none; }
            td[data-label]::before { content: attr(data-label); font-size: 13px; font-weight: 600; color: #999; }

            .container { padding: 16px 12px; }
            .type-toggle { gap: 8px; }
            .type-btn { flex: 1 1 0; text-align: center; padding: 12px 10px; }
            .items-list { gap: 8px; }
            .item-panel { padding: 10px; }
            .batch-row { padding: 10px; gap: 8px; flex-direction: column; align-items: stretch; }
            .batch-date-row { justify-content: space-between; }
            .batch-qty-row { width: 100%; justify-content: space-between; }
            .batch-row input[type=date] { width: 152px; }
            .batch-row .qty-input { width: 78px; }

            .sticky-bar { flex-direction: column; align-items: stretch; }
            .sticky-bar input, .sticky-bar button { width: 100%; }
            .sticky-bar .count-text { margin-right: 0; text-align: center; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📦 庫存盤點</h1>

    <div class="tabs">
        <button class="tab-btn active" id="tab-stocktake" onclick="switchTab('stocktake')">盤點作業</button>
        <button class="tab-btn" id="tab-items" onclick="switchTab('items')">商品管理</button>
        <button class="tab-btn" id="tab-history" onclick="switchTab('history')">盤點歷史</button>
    </div>

    <!-- 盤點作業 -->
    <div class="section active" id="section-stocktake">
        <div class="type-toggle">
            <button class="type-btn active" data-type="產品" onclick="selectType('產品')">選產品</button>
            <button class="type-btn" data-type="護理品" onclick="selectType('護理品')">選護理品</button>
        </div>

        <div class="section-label">全部品項（依系列、代碼排列，直接輸入實際數量）：</div>
        <div class="items-list" id="itemsGrid"></div>
    </div>

    <!-- 商品管理 -->
    <div class="section" id="section-items">
        <div class="section-label">選擇系列：</div>
        <div class="category-tabs" id="itemsCategoryTabs"></div>
        <div class="top-action-bar">
            <button class="btn btn-primary" onclick="startAddManageItem()">＋ 新增商品</button>
        </div>
        <div class="items-list" id="itemsManageList"></div>
    </div>

    <!-- 盤點歷史 -->
    <div class="section" id="section-history">
        <div id="historyList"></div>
    </div>
</div>

<!-- 盤點作業 底部固定列 -->
<div class="sticky-bar" id="stocktakeBar" style="display:flex;">
    <div class="count-text" id="draftCountText">已列入 0 項商品</div>
    <input type="date" id="stocktakeDate">
    <input type="text" id="stocktakeStaff" placeholder="盤點人姓名" style="width:110px;">
    <button class="btn btn-primary" onclick="submitStocktake()">送出本次盤點</button>
</div>


<!-- 實際數量九宮格鍵盤 -->
<div class="keypad-overlay" id="qtyKeypad" onclick="if(event.target===this) keypadConfirm()">
    <div class="keypad-sheet">
        <div class="keypad-header">
            <div class="keypad-label" id="keypadDisplayLabel"></div>
            <div class="keypad-display" id="keypadDisplayValue">0</div>
        </div>
        <div class="keypad-grid">
            <button type="button" onclick="keypadPressDigit('1')">1</button>
            <button type="button" onclick="keypadPressDigit('2')">2</button>
            <button type="button" onclick="keypadPressDigit('3')">3</button>
            <button type="button" onclick="keypadPressDigit('4')">4</button>
            <button type="button" onclick="keypadPressDigit('5')">5</button>
            <button type="button" onclick="keypadPressDigit('6')">6</button>
            <button type="button" onclick="keypadPressDigit('7')">7</button>
            <button type="button" onclick="keypadPressDigit('8')">8</button>
            <button type="button" onclick="keypadPressDigit('9')">9</button>
            <button type="button" class="keypad-fn" onclick="keypadClear()">C</button>
            <button type="button" onclick="keypadPressDigit('0')">0</button>
            <button type="button" class="keypad-fn" onclick="keypadBackspace()">⌫</button>
        </div>
        <button type="button" class="btn btn-primary keypad-confirm" onclick="keypadConfirm()">完成</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    firebase.initializeApp(STORE_CONFIG.firebase);
    const db = firebase.firestore();
    const itemsCol = db.collection("inventoryItems");
    const batchesCol = db.collection("inventoryBatches");
    const stocktakesCol = db.collection("inventoryStocktakes");

    let allItems = [];
    let allBatches = [];
    let batchesByItem = {};
    let currentType = "產品";
    // draft: { [itemId]: { batches: { [batchKeyId]: {batchId, expiryDate, bookQty, actualQty, isNewBatch, note} }, edited: bool } }
    let draft = {};

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    }

    function switchTab(name) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(`tab-${name}`).classList.add('active');
        document.getElementById(`section-${name}`).classList.add('active');
        document.getElementById('stocktakeBar').style.display = name === 'stocktake' ? 'flex' : 'none';
        if (name === 'items') renderItemsManage();
        if (name === 'history') loadHistory();
    }

    async function loadAll() {
        const [itemsSnap, batchesSnap] = await Promise.all([itemsCol.get(), batchesCol.get()]);
        allItems = itemsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        allBatches = batchesSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        batchesByItem = {};
        allBatches.forEach(b => {
            if (!batchesByItem[b.itemId]) batchesByItem[b.itemId] = [];
            batchesByItem[b.itemId].push(b);
        });
        Object.values(batchesByItem).forEach(list => list.sort((a, b) => (a.expiryDate || '').localeCompare(b.expiryDate || '')));
        initDraftForAllItems();
        renderItemsGrid();
        updateDraftBar();
    }

    function selectType(type) {
        currentType = type;
        document.querySelectorAll('.type-btn').forEach(b => b.classList.toggle('active', b.dataset.type === type));
        renderItemsGrid();
    }

    function activeItemsForType() {
        return allItems.filter(it => it.type === currentType && it.active !== false);
    }

    // 分類（系列）顯示順序：依實際系列名稱排列，未列出的分類排在最後
    const CATEGORY_ORDER = ['輕齡肌膚', '熟齡肌膚', '斑點肌膚', '乾燥細紋肌膚', '敏感肌膚', '通用肌膚', '痘痘粉刺肌膚', '營養系列', '紅顏系列', '調理系列', '機能系列', '日常生活系列'];
    function categoryRank(category) {
        const idx = CATEGORY_ORDER.indexOf(category);
        return idx === -1 ? CATEGORY_ORDER.length : idx;
    }
    function itemSeriesName(item) {
        return item.category || '未分類';
    }

    // 讓每項商品一載入就直接可輸入實際數量，不需要先點開
    function initDraftForAllItems() {
        allItems.filter(it => it.active !== false).forEach(item => {
            if (draft[item.id]) return;
            const existing = batchesByItem[item.id] || [];
            const batches = {};
            existing.forEach(b => {
                batches[b.id] = { batchId: b.id, expiryDate: b.expiryDate || '', bookQty: Number(b.qty) || 0, actualQty: Number(b.qty) || 0, isNewBatch: false, note: b.note || '' };
            });
            draft[item.id] = { item, batches, edited: false };
        });
    }

    function renderItemsGrid() {
        const grid = document.getElementById('itemsGrid');
        const items = activeItemsForType()
            .sort((a, b) => {
                const rankDiff = categoryRank(a.category) - categoryRank(b.category);
                if (rankDiff !== 0) return rankDiff;
                return (a.code || '').localeCompare(b.code || '', 'zh-Hant', { numeric: true, sensitivity: 'base' });
            });

        if (!items.length) {
            grid.innerHTML = '<div class="empty-hint">此類型尚無商品</div>';
            return;
        }

        let html = '';
        let lastSeries = null;
        items.forEach(it => {
            const series = itemSeriesName(it);
            if (series !== lastSeries) {
                html += `<div class="series-header">${series}</div>`;
                lastSeries = series;
            }
            const batches = draft[it.id] ? draft[it.id].batches : {};
            const batchKeys = Object.keys(batches);
            const batchRowsHtml = batchKeys.length
                ? batchKeys.map(key => renderBatchRow(it.id, key, batches[key])).join('')
                : '<div class="empty-batch-hint">庫存 0 · 尚無批次，等待新增批次</div>';
            html += `<div class="item-panel">
                <div class="code">${it.code || ''} <span style="font-weight:400;color:#888;font-size:13px;">${it.name || ''}</span></div>
                <div class="name"></div>
                ${batchRowsHtml}
                <button class="btn btn-add-batch" onclick="addNewBatchRow('${it.id}')">＋ 新增批次</button>
            </div>`;
        });
        grid.innerHTML = html;
    }

    function expiryBadgeClass(expiryDate) {
        if (!expiryDate) return '';
        const days = (new Date(expiryDate) - new Date()) / 86400000;
        if (days < 0) return 'danger';
        if (days <= 90) return 'warn';
        return '';
    }

    function renderBatchRow(itemId, batchKey, b) {
        const cls = expiryBadgeClass(b.expiryDate);
        const label = cls === 'danger' ? '已過期' : (cls === 'warn' ? '快到期' : '');
        const diff = (Number(b.actualQty) || 0) - (Number(b.bookQty) || 0);
        const diffCls = diff > 0 ? 'pos' : (diff < 0 ? 'neg' : 'zero');
        const diffText = diff > 0 ? `+${diff}` : diff;
        return `<div class="batch-row" data-item="${itemId}" data-batch="${batchKey}">
            <div class="batch-date-row">
                <input type="date" value="${b.expiryDate || ''}" onchange="updateBatchField('${itemId}','${batchKey}','expiryDate',this.value)">
                ${label ? `<span class="expiry-badge ${cls}">${label}</span>` : ''}
            </div>
            <div class="batch-qty-row">
                ${b.isNewBatch ? '' : `<div class="qty-field"><label>帳面</label><span>${b.bookQty}</span></div>`}
                <div class="qty-field">
                    <label>實際</label>
                    <input type="text" class="qty-input" inputmode="none" readonly value="${b.actualQty}" onclick="openQtyKeypad('${itemId}','${batchKey}')">
                </div>
                <div class="diff ${diffCls}">${b.isNewBatch ? '新批次' : diffText}</div>
                <button class="remove-batch" onclick="removeBatchRow('${itemId}','${batchKey}')" title="移除此批次">✕</button>
            </div>
        </div>`;
    }

    function addNewBatchRow(itemId) {
        const key = 'new_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
        draft[itemId].batches[key] = { batchId: null, expiryDate: '', bookQty: 0, actualQty: 0, isNewBatch: true, note: '' };
        renderItemsGrid();
    }

    function removeBatchRow(itemId, batchKey) {
        delete draft[itemId].batches[batchKey];
        draft[itemId].edited = true;
        renderItemsGrid();
        updateDraftBar();
    }

    function updateBatchField(itemId, batchKey, field, value) {
        const b = draft[itemId].batches[batchKey];
        if (field === 'actualQty') b.actualQty = Number(value) || 0;
        else b[field] = value;
        draft[itemId].edited = true;
        renderItemsGrid();
        updateDraftBar();
    }

    // ── 實際數量九宮格數字鍵盤 ──────────────────────────────
    let keypadTarget = null;
    let keypadValue = '0';
    let keypadFresh = true;

    function openQtyKeypad(itemId, batchKey) {
        const b = draft[itemId].batches[batchKey];
        keypadTarget = { itemId, batchKey };
        keypadValue = String(b ? b.actualQty : 0);
        keypadFresh = true;
        renderKeypadDisplay();
        document.getElementById('qtyKeypad').classList.add('active');
    }

    function closeQtyKeypad() {
        document.getElementById('qtyKeypad').classList.remove('active');
        keypadTarget = null;
    }

    function keypadPressDigit(d) {
        if (keypadFresh) {
            keypadValue = d === '0' ? '0' : d;
        } else if (keypadValue === '0') {
            keypadValue = d;
        } else if (keypadValue.length < 6) {
            keypadValue += d;
        }
        keypadFresh = false;
        renderKeypadDisplay();
    }

    function keypadBackspace() {
        keypadValue = keypadValue.slice(0, -1) || '0';
        keypadFresh = false;
        renderKeypadDisplay();
    }

    function keypadClear() {
        keypadValue = '0';
        keypadFresh = true;
        renderKeypadDisplay();
    }

    function renderKeypadDisplay() {
        document.getElementById('keypadDisplayValue').textContent = keypadValue;
        if (keypadTarget) {
            const it = draft[keypadTarget.itemId].item;
            document.getElementById('keypadDisplayLabel').textContent = `${it.code || ''} ${it.name || ''}`;
        }
    }

    function keypadConfirm() {
        if (keypadTarget) {
            updateBatchField(keypadTarget.itemId, keypadTarget.batchKey, 'actualQty', keypadValue);
        }
        closeQtyKeypad();
    }

    function updateDraftBar() {
        const editedCount = Object.values(draft).filter(d => d.edited).length;
        const totalCount = allItems.filter(it => it.active !== false).length;
        document.getElementById('draftCountText').textContent = `本次盤點涵蓋全部 ${totalCount} 項商品（已編輯 ${editedCount} 項）`;
    }

    // 送出時涵蓋系統中所有啟用商品：已展開編輯過的用輸入值，其餘用目前帳面數量（視為無差異）
    function buildFullStocktakeItems() {
        const items = [];
        allItems.filter(it => it.active !== false).forEach(item => {
            const itemDraft = draft[item.id];
            if (itemDraft) {
                Object.values(itemDraft.batches).forEach(b => {
                    items.push({
                        itemId: item.id, itemCode: item.code || '', itemName: item.name || '',
                        batchId: b.batchId, expiryDate: b.expiryDate, bookQty: b.bookQty, actualQty: b.actualQty,
                        diff: (Number(b.actualQty) || 0) - (Number(b.bookQty) || 0), isNewBatch: b.isNewBatch
                    });
                });
            } else {
                const existing = batchesByItem[item.id] || [];
                if (existing.length) {
                    existing.forEach(b => {
                        const qty = Number(b.qty) || 0;
                        items.push({
                            itemId: item.id, itemCode: item.code || '', itemName: item.name || '',
                            batchId: b.id, expiryDate: b.expiryDate || '', bookQty: qty, actualQty: qty,
                            diff: 0, isNewBatch: false
                        });
                    });
                } else {
                    items.push({
                        itemId: item.id, itemCode: item.code || '', itemName: item.name || '',
                        batchId: null, expiryDate: '', bookQty: 0, actualQty: 0, diff: 0, isNewBatch: false
                    });
                }
            }
        });
        return items;
    }

    async function submitStocktake() {
        const date = document.getElementById('stocktakeDate').value || new Date().toISOString().slice(0, 10);
        const staff = document.getElementById('stocktakeStaff').value.trim();
        if (!staff) { alert('請輸入盤點人姓名'); return; }

        const items = buildFullStocktakeItems();
        if (!items.length) { alert('系統目前沒有商品可供盤點'); return; }
        const totalDiff = items.reduce((s, it) => s + it.diff, 0);

        try {
            const writeBatch = db.batch();
            for (const it of items) {
                if (it.isNewBatch) {
                    const ref = batchesCol.doc();
                    writeBatch.set(ref, { itemId: it.itemId, expiryDate: it.expiryDate, qty: it.actualQty, note: '', createdAt: new Date(), updatedAt: new Date() });
                    it.batchId = ref.id;
                } else if (it.batchId) {
                    writeBatch.update(batchesCol.doc(it.batchId), { qty: it.actualQty, updatedAt: new Date() });
                }
            }
            await writeBatch.commit();
            await stocktakesCol.add({ date, staff, itemCount: items.length, totalDiff, items, createdAt: new Date() });

            draft = {};
            document.getElementById('stocktakeStaff').value = '';
            updateDraftBar();
            showToast('已送出本次盤點');
            await loadAll();
        } catch (err) {
            alert('送出失敗：' + err.message);
        }
    }

    // ── 商品管理 ──────────────────────────────

    // manage 分頁狀態：選取的系列（null = 全部）、目前展開編輯中的商品 id、是否正在新增
    let manageCategory = null;
    let expandedItemId = null;
    let addingNewItem = false;

    function manageCategoryList() {
        const known = new Set(CATEGORY_ORDER);
        const extra = [];
        allItems.forEach(it => {
            const c = it.category || '未分類';
            if (!known.has(c) && !extra.includes(c)) extra.push(c);
        });
        return [...CATEGORY_ORDER, ...extra];
    }

    function renderItemsManage() {
        renderManageCategoryTabs();
        renderManageList();
    }

    function renderManageCategoryTabs() {
        const wrap = document.getElementById('itemsCategoryTabs');
        const counts = {};
        allItems.forEach(it => { const c = it.category || '未分類'; counts[c] = (counts[c] || 0) + 1; });
        let html = `<button class="chip-btn ${manageCategory === null ? 'active' : ''}" onclick="selectManageCategory(null)">全部（${allItems.length}）</button>`;
        html += manageCategoryList().filter(c => counts[c]).map(c =>
            `<button class="chip-btn ${manageCategory === c ? 'active' : ''}" onclick="selectManageCategory('${c.replace(/'/g, "\\'")}')">${c}（${counts[c]}）</button>`
        ).join('');
        wrap.innerHTML = html;
    }

    function selectManageCategory(cat) {
        manageCategory = cat;
        expandedItemId = null;
        addingNewItem = false;
        renderItemsManage();
    }

    function filteredManageItems() {
        let items = [...allItems];
        if (manageCategory !== null) {
            items = items.filter(it => (it.category || '未分類') === manageCategory);
        }
        return items.sort((a, b) => {
            const rankDiff = categoryRank(a.category) - categoryRank(b.category);
            if (rankDiff !== 0) return rankDiff;
            return (a.code || '').localeCompare(b.code || '', 'zh-Hant', { numeric: true, sensitivity: 'base' });
        });
    }

    function renderManageList() {
        const wrap = document.getElementById('itemsManageList');
        const items = filteredManageItems();
        let html = '';
        if (addingNewItem) html += renderManageEditPanel(null);
        if (!items.length && !addingNewItem) {
            html += '<div class="empty-hint">此系列尚無商品</div>';
        }
        items.forEach(it => {
            html += expandedItemId === it.id ? renderManageEditPanel(it) : renderManageSummaryPanel(it);
        });
        wrap.innerHTML = html;
    }

    function renderManageSummaryPanel(it) {
        return `<div class="item-panel manage-panel" onclick="toggleExpandItem('${it.id}')">
            <div class="manage-row">
                <div>
                    <div class="code">${it.code || ''} <span style="font-weight:400;color:#888;font-size:14px;">${it.name || ''}</span></div>
                    <div class="name">${it.type || ''} · ${it.category || '未分類'} · ${it.unit || '-'}${it.active === false ? ' · 已停用' : ''}</div>
                </div>
                <span class="expand-arrow">›</span>
            </div>
        </div>`;
    }

    function renderManageEditPanel(it) {
        const key = it ? it.id : 'new';
        const defaultCategory = it ? (it.category || '') : (manageCategory || '');
        return `<div class="item-panel manage-edit" onclick="event.stopPropagation()">
            <div class="form-row"><label>代碼</label><input type="text" id="mf_code_${key}" value="${it ? (it.code || '') : ''}" placeholder="例如 AB90"></div>
            <div class="form-row"><label>名稱</label><input type="text" id="mf_name_${key}" value="${it ? (it.name || '') : ''}"></div>
            <div class="form-row"><label>類型</label>
                <select id="mf_type_${key}">
                    <option value="產品" ${(!it || it.type === '產品') ? 'selected' : ''}>產品</option>
                    <option value="護理品" ${it && it.type === '護理品' ? 'selected' : ''}>護理品</option>
                </select>
            </div>
            <div class="form-row"><label>分類（系列）</label>
                <select id="mf_category_${key}">
                    ${CATEGORY_ORDER.map(c => `<option value="${c}" ${defaultCategory === c ? 'selected' : ''}>${c}</option>`).join('')}
                </select>
            </div>
            <div class="form-row"><label>單位</label><input type="text" id="mf_unit_${key}" value="${it ? (it.unit || '') : ''}" placeholder="例如 瓶、盒"></div>
            <div class="form-row"><label>會員價</label><input type="number" id="mf_price_${key}" value="${it ? (it.memberPrice || 0) : 0}"></div>
            <div class="form-row"><label>PV</label><input type="number" id="mf_pv_${key}" value="${it ? (it.pv || 0) : 0}"></div>
            <div class="form-row"><label>備註</label><textarea id="mf_note_${key}" rows="2">${it ? (it.note || '') : ''}</textarea></div>
            ${it ? `<div class="form-row"><label><input type="checkbox" id="mf_active_${key}" ${it.active !== false ? 'checked' : ''} style="width:auto;margin-right:6px;">啟用</label></div>` : ''}
            <div class="modal-actions">
                ${it ? `<button class="btn btn-danger btn-sm" onclick="deleteManageItem('${it.id}')">刪除</button>` : ''}
                <button class="btn btn-outline" onclick="cancelManageEdit()">取消</button>
                <button class="btn btn-primary" onclick="saveManageItem('${it ? it.id : ''}')">儲存</button>
            </div>
        </div>`;
    }

    function toggleExpandItem(id) {
        addingNewItem = false;
        expandedItemId = expandedItemId === id ? null : id;
        renderManageList();
    }

    function startAddManageItem() {
        expandedItemId = null;
        addingNewItem = true;
        renderManageList();
    }

    function cancelManageEdit() {
        expandedItemId = null;
        addingNewItem = false;
        renderManageList();
    }

    async function saveManageItem(id) {
        const key = id || 'new';
        const name = document.getElementById(`mf_name_${key}`).value.trim();
        if (!name) { alert('請輸入商品名稱'); return; }
        const data = {
            code: document.getElementById(`mf_code_${key}`).value.trim(),
            name,
            type: document.getElementById(`mf_type_${key}`).value,
            category: document.getElementById(`mf_category_${key}`).value,
            unit: document.getElementById(`mf_unit_${key}`).value.trim(),
            memberPrice: Number(document.getElementById(`mf_price_${key}`).value) || 0,
            pv: Number(document.getElementById(`mf_pv_${key}`).value) || 0,
            note: document.getElementById(`mf_note_${key}`).value.trim(),
            updatedAt: new Date()
        };
        if (id) {
            data.active = document.getElementById(`mf_active_${key}`).checked;
            await itemsCol.doc(id).update(data);
        } else {
            data.active = true;
            await itemsCol.add(data);
        }
        expandedItemId = null;
        addingNewItem = false;
        await loadAll();
        renderItemsManage();
        showToast('已儲存商品');
    }

    async function deleteManageItem(id) {
        if (!confirm('刪除此商品會連同其批次庫存一併刪除，確定要刪除嗎？')) return;
        const batch = db.batch();
        batch.delete(itemsCol.doc(id));
        (batchesByItem[id] || []).forEach(b => batch.delete(batchesCol.doc(b.id)));
        await batch.commit();
        expandedItemId = null;
        await loadAll();
        renderItemsManage();
        showToast('已刪除商品');
    }

    // ── 盤點歷史 ──────────────────────────────

    async function loadHistory() {
        const snap = await stocktakesCol.get();
        const records = snap.docs.map(d => ({ id: d.id, ...d.data() }))
            .sort((a, b) => (b.date || '').localeCompare(a.date || ''));
        const container = document.getElementById('historyList');
        if (!records.length) {
            container.innerHTML = '<div class="empty-hint">尚無盤點紀錄</div>';
            return;
        }
        container.innerHTML = records.map(r => {
            const diffCls = r.totalDiff > 0 ? 'pos' : (r.totalDiff < 0 ? 'neg' : 'zero');
            const detailRows = (r.items || []).map(it => `
                <tr>
                    <td data-label="商品">${it.itemCode || ''} ${it.itemName || ''}</td>
                    <td data-label="到期日">${it.expiryDate || '-'}</td>
                    <td data-label="帳面">${it.bookQty}</td>
                    <td data-label="實際">${it.actualQty}</td>
                    <td data-label="差異" style="color:${it.diff > 0 ? '#10b981' : (it.diff < 0 ? '#d64545' : '#999')}">${it.diff > 0 ? '+' + it.diff : it.diff}</td>
                </tr>`).join('');
            return `<div class="history-item" onclick="toggleHistoryDetail('${r.id}')">
                <div class="row1">
                    <span>${r.date} · ${r.staff} · ${r.itemCount} 項</span>
                    <span class="diff-tag" style="color:${r.totalDiff > 0 ? '#10b981' : (r.totalDiff < 0 ? '#d64545' : '#999')}">總差異 ${r.totalDiff > 0 ? '+' + r.totalDiff : r.totalDiff}</span>
                </div>
                <div class="history-detail" id="detail-${r.id}">
                    <table><thead><tr><th>商品</th><th>到期日</th><th>帳面</th><th>實際</th><th>差異</th></tr></thead>
                    <tbody>${detailRows}</tbody></table>
                </div>
            </div>`;
        }).join('');
    }

    function toggleHistoryDetail(id) {
        document.getElementById(`detail-${id}`).classList.toggle('open');
    }

    // ── init ──────────────────────────────
    document.getElementById('stocktakeDate').value = new Date().toISOString().slice(0, 10);
    loadAll();
</script>
</body>
</html>
