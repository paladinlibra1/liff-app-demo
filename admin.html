<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorfashion 麻豆店 後台管理系統</title>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <style>
        :root {
            --primary-color: #d68095; 
            --primary-dark: #c06c82;  
            --bg-color: #fdf2f5;      
            --card-bg: #ffffff;        
            --text-color: #5d4037;    
            --fc-button-bg-color: var(--primary-color);
            --fc-button-border-color: var(--primary-dark);
            --fc-button-hover-bg-color: var(--primary-dark);
            --fc-button-hover-border-color: var(--primary-dark);
            --fc-button-active-bg-color: var(--primary-dark);
            --fc-button-active-border-color: var(--primary-dark);
            --fc-today-bg-color: #fff0f3;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-primary { background: var(--primary-color); color: white; }
        .btn-outline { background: white; border: 1px solid var(--primary-color); color: var(--primary-color); }
        .btn-success { background: #4CAF50; color: white; }
        .btn-toggle { background: #607d8b; color: white; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #fae1e6; padding-bottom: 10px; overflow-x: auto; }
        .tab-btn { background: transparent; border: none; font-size: 18px; font-weight: bold; color: #aaa; cursor: pointer; padding: 10px 20px; white-space: nowrap; }
        .tab-btn.active { color: var(--primary-dark); border-bottom: 4px solid var(--primary-color); }

        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.4s ease; }

        .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; background: white; padding: 15px; border-radius: 10px; align-items: center; }
        .controls input { padding: 8px; border: 1px solid #e8aeb7; border-radius: 5px; }
        .quick-btn { border-radius: 20px; }

        .box-container { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #fdf2f5; }
        th { background-color: var(--primary-color); color: white; white-space: nowrap; }
        
        #loading { display: none; text-align: center; padding: 20px; color: var(--primary-color); font-weight: bold; position: fixed; top: 0; width: 100%; background: rgba(255,255,255,0.9); z-index: 10000; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ================= 手機版優化 ================= */
        @media (max-width: 768px) {
            body { padding: 10px; }
            .container { padding: 10px; }
            .controls > div:first-child, .pc-only { display: none !important; }
            .label-text { flex: 1 0 100%; font-size: 13px; margin-top: 5px; margin-bottom: -5px; color: #888; }
            #list-nav-mini { margin-left: auto; display: flex !important; align-items: center; gap: 5px; }
            .fc-event { pointer-events: none !important; } /* 手機日曆純檢視 */
            .action-btns { display: flex; gap: 5px; }
            .btn-sm { padding: 10px !important; }
            .top-action-bar { display: flex; width: 100%; gap: 5px; }
            .top-action-bar .btn { flex: 1; padding: 10px 2px; font-size: 13px; }
            th, td { white-space: nowrap !important; padding: 10px; font-size: 14px; }
            .box-container { overflow-x: auto; }
        }
    </style>
</head>
<body>

    <div id="dashboard" class="container">    
        <div id="loading">🚀 資料加載中...</div>

        <div class="tabs">
            <button class="tab-btn active" id="tab-booking" onclick="switchTab('booking')">📅 預約管理</button>
            <button class="tab-btn" id="tab-member" onclick="switchTab('member')">👥 會員清單</button>
            <button class="tab-btn" id="tab-operating" onclick="switchTab('operating')">🗓️ 營業設定</button>
        </div>

        <div id="section-booking" class="section active">
            <div class="header">
                <div class="top-action-bar">
                    <button class="btn btn-success" onclick="createNewBooking()">➕ 代客預約</button>
                    <button class="btn btn-toggle" id="viewToggleBtn" onclick="toggleViewMode()">日曆模式 📅</button>
                    <button class="btn btn-primary" onclick="loadBookingData()">🔄 重新整理</button>
                </div>
            </div>

            <div id="listViewWrapper">
                <div class="controls">
                    <div>📅 檢視：</div>
                    <button class="btn btn-outline quick-btn" id="btn-day" onclick="setFilterMode('day')">單日</button>
                    <button class="btn btn-outline quick-btn" id="btn-week" onclick="setFilterMode('week')">單週</button>
                    <button class="btn btn-outline quick-btn" id="btn-month" onclick="setFilterMode('month')">單月</button>
                    <button class="btn btn-outline quick-btn" id="btn-all" onclick="setFilterMode('all')">全部</button>

                    <div id="list-nav-mini" style="display: none;">
                        <button class="btn btn-outline" style="padding:4px 8px" onclick="changeListOffset(-1)">＜</button>
                        <span id="list-nav-label" style="font-weight:bold; font-size:14px; color:var(--primary-dark);"></span>
                        <button class="btn btn-outline" style="padding:4px 8px" onclick="changeListOffset(1)">＞</button>
                    </div>

                    <div style="border-left:2px solid #eee; height:30px; margin:0 10px" class="pc-only"></div>
                    <div class="label-text">特定日：</div>
                    <input type="date" id="dateFilter" onchange="setQuickFilter('custom')">
                    <input type="text" id="searchBookingInput" placeholder="🔍 搜尋姓名/電話/備註..." onkeyup="filterBookingTable()" style="flex-grow:1">
                </div>

                <div class="box-container">
                    <table style="overflow-x:auto">
                        <thead><tr><th>時間</th><th>身分</th><th>預約人</th><th>同行人</th><th>電話</th><th>備註</th><th>操作</th></tr></thead>
                        <tbody id="bookingTableBody"></tbody>
                    </table>
                </div>
            </div>

            <div id="calendarViewWrapper" class="box-container calendar-wrapper" style="display:none; padding:20px">
                <div id="bookingCalendar"></div>
            </div>
        </div>

        <div id="section-member" class="section">
            <div class="controls">
                <input type="text" id="searchMemberInput" placeholder="🔍 搜尋會員姓名/電話..." onkeyup="filterMemberTable()" style="width:100%">
            </div>
            <div class="box-container" style="overflow-x:auto">
                <table>
                    <thead><tr><th>姓名</th><th>電話</th><th>LINE</th><th>初次</th><th>最後</th><th>次數</th><th>介紹人</th></tr></thead>
                    <tbody id="memberTableBody"></tbody>
                </table>
            </div>
        </div>

        <div id="section-operating" class="section">
            <div class="header" style="background: #e8f5e9; padding: 15px; border-radius: 10px; color: #2e7d32; margin-bottom:15px;">
                <strong>💡 說明：</strong> 點擊日期可切換「營業」或「店休」。
            </div>
            <div class="box-container" style="padding:20px">
                <div id="operatingCalendar"></div>
            </div>
        </div>
    </div>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbytizr6IDdZux7gaCZjYqiXVi0uQZELig_xaBagzNyDg84Wfi18IEZSYi7fTk3P3pFB/exec";
        const FRONTEND_URL = "https://paladinlibra1.github.io/liff-app-demo/index.html";

        let allBookings = [], allMembers = [], allOperatingDays = [];
        let currentFilterMode = 'day', viewMode = 'list', listOffset = 0;
        let fcBookingCalendar = null, fcOperatingCalendar = null;

        // 頁面加載直接抓資料
        window.onload = function() {
            loadBookingData(true);
        };

        async function callApi(action, payload = {}) {
            const res = await fetch(GAS_API_URL, { method: "POST", body: JSON.stringify({ action, payload }) });
            return await res.json();
        }

        async function loadBookingData(isInit = false) {
            document.getElementById('loading').style.display = 'block';
            try {
                const res = await callApi("getAllBookings");
                if (res.status === "success") {
                    allBookings = res.data;
                    if (isInit) setFilterMode('day'); else filterBookingTable();
                    if (fcBookingCalendar) fcBookingCalendar.refetchEvents();
                }
            } catch (err) { console.error(err); }
            document.getElementById('loading').style.display = 'none';
        }

        function setFilterMode(mode) {
            currentFilterMode = mode; listOffset = 0;
            document.querySelectorAll('.quick-btn').forEach(btn => {
                btn.classList.remove('btn-primary'); btn.classList.add('btn-outline');
            });
            if(mode !== 'custom' && document.getElementById(`btn-${mode}`)) {
                document.getElementById(`btn-${mode}`).classList.replace('btn-outline', 'btn-primary');
                document.getElementById('dateFilter').value = '';
            }
            filterBookingTable();
        }

        function changeListOffset(step) { listOffset += step; filterBookingTable(); }
        function setQuickFilter(mode) { if(mode==='custom') setFilterMode('custom'); }

        function filterBookingTable() {
            const keyword = document.getElementById('searchBookingInput').value.toLowerCase();
            const customDate = document.getElementById('dateFilter').value;
            const now = new Date();
            let start, end, navLabel = document.getElementById('list-nav-label'), navDiv = document.getElementById('list-nav-mini');

            if (currentFilterMode === 'all') {
                navDiv.style.display = 'none'; start = "1970-01-01"; end = "2100-12-31";
            } else if (currentFilterMode === 'custom') {
                navDiv.style.display = 'none'; start = customDate; end = customDate;
            } else {
                navDiv.style.display = 'flex';
                if (currentFilterMode === 'day') {
                    let d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + listOffset);
                    start = getFormattedDate(d); end = start; navLabel.innerText = `${d.getMonth()+1}/${d.getDate()}`;
                } else if (currentFilterMode === 'week') {
                    let d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + (listOffset * 7));
                    let day = d.getDay() || 7;
                    let s = new Date(d); s.setDate(d.getDate() - day + 1);
                    let e = new Date(s); e.setDate(s.getDate() + 6);
                    start = getFormattedDate(s); end = getFormattedDate(e);
                    navLabel.innerText = `${s.getMonth()+1}/${s.getDate()}-${e.getMonth()+1}/${e.getDate()}`;
                } else if (currentFilterMode === 'month') {
                    let d = new Date(now.getFullYear(), now.getMonth() + listOffset, 1);
                    start = getFormattedDate(new Date(d.getFullYear(), d.getMonth(), 1));
                    end = getFormattedDate(new Date(d.getFullYear(), d.getMonth() + 1, 0));
                    navLabel.innerText = `${d.getFullYear()}/${d.getMonth()+1}月`;
                }
            }

            let filtered = allBookings.filter(r => {
                const mk = (r.name + r.phone + (r.name2||'') + (r.remark||'')).toLowerCase().includes(keyword);
                let md = (r.date >= start && r.date <= end);
                if(currentFilterMode==='custom' && customDate==="") md = true;
                return mk && md;
            });

            renderBookingTable(filtered);
        }

        function renderBookingTable(data) {
            const tbody = document.getElementById('bookingTableBody');
            tbody.innerHTML = data.map(row => `
                <tr>
                    <td><strong>${row.date}</strong><br><span style="color:var(--primary-dark);font-size:18px">${row.time}</span></td>
                    <td>${row.type}</td><td><strong>${row.name}</strong></td><td>${row.name2||'-'}</td><td>${row.phone}</td>
                    <td><div style="font-size:12px;max-width:150px;white-space:pre-wrap">${row.remark||'-'}</div></td>
                    <td class="action-btns">
                        <button class="btn-sm btn-primary" onclick="editBooking('${row.id}')">編輯</button>
                        <button class="btn-sm btn-outline" style="color:red;border-color:red" onclick="cancelBooking('${row.id}')">取消</button>
                    </td>
                </tr>
            `).join('') || '<tr><td colspan="7" style="text-align:center">無符合預約</td></tr>';
        }

        function getFormattedDate(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

        function toggleViewMode() {
            viewMode = (viewMode === 'list' ? 'calendar' : 'list');
            document.getElementById('listViewWrapper').style.display = (viewMode === 'list' ? 'block' : 'none');
            document.getElementById('calendarViewWrapper').style.display = (viewMode === 'calendar' ? 'block' : 'none');
            document.getElementById('viewToggleBtn').innerText = (viewMode === 'list' ? '日曆模式 📅' : '列表模式 📝');
            if (viewMode === 'calendar') { if(!fcBookingCalendar) initBookingCalendar(); else setTimeout(()=>fcBookingCalendar.render(),50); }
        }

        function initBookingCalendar() {
            fcBookingCalendar = new FullCalendar.Calendar(document.getElementById('bookingCalendar'), {
                initialView: 'timeGridWeek', locale: 'zh-tw', slotMinTime: '10:00:00', slotMaxTime: '21:00:00',
                allDaySlot: false, height: 'auto', slotDuration: '00:30:00',
                events: function(info, success) {
                    let grouped = {};
                    allBookings.forEach(r => { let dt = `${r.date}T${r.time}:00`; if(!grouped[dt]) grouped[dt]=[]; grouped[dt].push(r); });
                    success(Object.keys(grouped).map(dt => ({ start: dt, extendedProps: { bookings: grouped[dt] }, display: 'background', backgroundColor: 'transparent' })));
                },
                eventContent: function(info) {
                    let html = info.event.extendedProps.bookings.map(r => {
                        let c = (r.type.includes('新客') ? '#FFCA28' : '#4CAF50');
                        return `<div style="background:${c};color:white;margin-bottom:2px;text-align:center;font-size:11px;padding:2px">${r.name}${r.name2?'<br>'+r.name2:''}</div>`;
                    }).join('');
                    return { html: `<div style="width:100%">${html}</div>` };
                }
            });
            fcBookingCalendar.render();
        }

        async function loadMemberData() {
            const res = await callApi("getAllMembers");
            if (res.status === "success") { allMembers = res.data; filterMemberTable(); }
        }

        function filterMemberTable() {
            const kw = document.getElementById('searchMemberInput').value.toLowerCase();
            const filtered = allMembers.filter(m => (m.name+m.phone+(m.lineName||'')).toLowerCase().includes(kw));
            document.getElementById('memberTableBody').innerHTML = filtered.map(m => `
                <tr>
                    <td><strong>${m.name}</strong></td><td>${m.phone}</td><td>${m.lineName||'-'}</td>
                    <td>${m.firstVisit}</td><td>${m.lastVisit}</td><td>${m.count}</td>
                    <td><button class="btn-sm btn-outline" onclick="editReferrer('${m.phone}','${m.referrer||''}')">${m.referrer || '✏️設定'}</button></td>
                </tr>
            `).join('');
        }

        async function editReferrer(phone, old) {
            let res = prompt("請輸入介紹人姓名：", old);
            if(res !== null) { 
                document.getElementById('loading').style.display='block';
                await callApi("updateMemberReferrer", { phone, referrer: res }); 
                loadMemberData(); 
            }
        }

        async function loadOperatingData() {
            const res = await callApi("getOperatingDays");
            if(res.status === "success") { allOperatingDays = res.data; initOperatingCalendar(); }
        }

        function initOperatingCalendar() {
            fcOperatingCalendar = new FullCalendar.Calendar(document.getElementById('operatingCalendar'), {
                initialView: 'dayGridMonth', locale: 'zh-tw', height: 'auto',
                events: function(info, success) {
                    success(allOperatingDays.map(d => ({ start: d, title: '🟢營業', allDay: true, color: '#4CAF50' })));
                },
                dateClick: async function(info) {
                    if(confirm("切換該日營業狀態？")) {
                        const action = allOperatingDays.includes(info.dateStr) ? "removeOperatingDay" : "addOperatingDay";
                        await callApi(action, { date: info.dateStr });
                        const res = await callApi("getOperatingDays");
                        allOperatingDays = res.data;
                        fcOperatingCalendar.refetchEvents();
                    }
                }
            });
            fcOperatingCalendar.render();
        }

        function createNewBooking() { window.open(`${FRONTEND_URL}?role=admin`, '_blank'); }
        function editBooking(id) { window.open(`${FRONTEND_URL}?role=admin&id=${id}`, '_blank'); }
        async function cancelBooking(id) { if(confirm("確定取消此預約？")){ await callApi("cancelBooking", {id}); loadBookingData(); } }

        function switchTab(t) {
            document.querySelectorAll('.tab-btn, .section').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-'+t).classList.add('active');
            document.getElementById('section-'+t).classList.add('active');
            if(t === 'member' && allMembers.length === 0) loadMemberData();
            if(t === 'operating') loadOperatingData();
        }
    </script>
</body>
</html>
