<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorfashion 後台管理系統</title>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <style>
        :root {
            --primary-color: #d68095; 
            --primary-dark: #c06c82;  
            --bg-color: #fdf2f5;      
            --card-bg: #ffffff;       
            --text-color: #5d4037;    
            --fc-button-bg-color: var(--primary-color);
            --fc-button-border-color: var(--primary-dark);
            --fc-button-hover-bg-color: var(--primary-dark);
            --fc-button-hover-border-color: var(--primary-dark);
            --fc-button-active-bg-color: var(--primary-dark);
            --fc-button-active-border-color: var(--primary-dark);
            --fc-today-bg-color: #fff0f3;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; }
        .login-box { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(214, 128, 149, 0.15); text-align: center; }
        .login-box input { padding: 10px; font-size: 16px; border: 1px solid #e8aeb7; border-radius: 8px; margin-bottom: 15px; width: 80%; text-align: center; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-primary { background: var(--primary-color); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-outline { background: white; border: 1px solid var(--primary-color); color: var(--primary-color); }
        .btn-outline:hover { background: #fff0f3; }
        .btn-success { background: #4CAF50; color: white; }
        .btn-success:hover { background: #388E3C; }
        .btn-toggle { background: #607d8b; color: white; }
        .btn-toggle:hover { background: #455a64; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #fae1e6; padding-bottom: 10px; overflow-x: auto; white-space: nowrap; }
        .tab-btn { background: transparent; border: none; font-size: 18px; font-weight: bold; color: #aaa; cursor: pointer; padding: 10px 20px; border-radius: 10px 10px 0 0; transition: 0.3s; }
        .tab-btn:hover { color: var(--primary-color); }
        .tab-btn.active { color: var(--primary-dark); border-bottom: 4px solid var(--primary-color); }

        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.4s ease; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); align-items: center;}
        .controls input { padding: 8px; border: 1px solid #e8aeb7; border-radius: 5px; font-size: 14px; outline: none; }
        .controls input:focus { border-color: var(--primary-dark); }
        .quick-btn { padding: 8px 15px; font-size: 14px; border-radius: 20px; }

        .box-container { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); padding: 0; }
        .calendar-wrapper { padding: 20px; }

        table { width: 100%; border-collapse: collapse; font-size: 15px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #fdf2f5; }
        th { background-color: var(--primary-color); color: white; font-weight: 600; white-space: nowrap; }
        tr:hover { background-color: #faf5f6; }
        
        .action-btns { display: flex; gap: 5px; }
        .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 5px; }
        .btn-edit { background: #64b5f6; color: white; }
        .btn-cancel { background: #e57373; color: white; }

        #loading { display: none; text-align: center; padding: 50px; color: var(--primary-color); font-weight: bold; }

        /* FullCalendar 日曆樣式微調 */
        .fc-event { cursor: pointer; padding: 2px 4px; border: none; }
        .fc-event-title { font-weight: bold; }
        .fc-daygrid-day { cursor: pointer; transition: background-color 0.2s; }
        .fc-daygrid-day:hover { background-color: #fafafa; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2 style="color: var(--primary-dark);">🔒 Colorfashion 後台</h2>
            <p>請輸入管理員密碼</p>
            <input type="password" id="adminPwd" placeholder="輸入密碼" onkeypress="if(event.key === 'Enter') checkLogin()">
            <br>
            <button class="btn btn-primary" onclick="checkLogin()">登入系統</button>
        </div>
    </div>

    <div id="dashboard" class="container" style="display:none;">
        
        <div class="tabs">
            <button class="tab-btn active" id="tab-booking" onclick="switchTab('booking')">📅 預約管理</button>
            <button class="tab-btn" id="tab-member" onclick="switchTab('member')">👥 會員清單</button>
            <button class="tab-btn" id="tab-operating" onclick="switchTab('operating')">🗓️ 營業日曆設定</button>
        </div>

        <div id="loading">🚀 資料處理中，請稍候...</div>

        <div id="section-booking" class="section active">
            <div class="header">
                <div>
                    <button class="btn btn-success" onclick="createNewBooking()" style="margin-right: 10px;">➕ 幫客人建立預約</button>
                    <button class="btn btn-primary" onclick="loadBookingData()" style="margin-right: 10px;">🔄 重新整理</button>
                    <button class="btn btn-toggle" id="viewToggleBtn" onclick="toggleViewMode()">切換至日曆模式 📅</button>
                </div>
            </div>

            <div id="listViewWrapper">
                <div class="controls">
                    <div style="font-weight: bold; color: var(--primary-dark);">📅 檢視：</div>
                    <button class="btn btn-primary quick-btn" id="btn-today" onclick="setQuickFilter('today')">今天</button>
                    <button class="btn btn-outline quick-btn" id="btn-week" onclick="setQuickFilter('week')">本週</button>
                    <button class="btn btn-outline quick-btn" id="btn-month" onclick="setQuickFilter('month')">本月</button>
                    <button class="btn btn-outline quick-btn" id="btn-all" onclick="setQuickFilter('all')">全部</button>
                    
                    <div style="border-left: 2px solid #fdf2f5; height: 30px; margin: 0 10px;"></div>
                    <div style="font-size: 14px; color: #888;">特定日：</div>
                    <input type="date" id="dateFilter" onchange="setQuickFilter('custom')">
                    
                    <div style="border-left: 2px solid #fdf2f5; height: 30px; margin: 0 10px;"></div>
                    <input type="text" id="searchBookingInput" placeholder="🔍 搜尋姓名、電話或備註..." onkeyup="filterBookingTable()" style="flex-grow: 1; max-width: 250px;">
                </div>

                <div class="box-container" style="overflow-x: auto;">
                    <table id="bookingTable">
                        <thead>
                            <tr>
                                <th>預約時間</th>
                                <th>身分</th>
                                <th>預約人姓名</th>
                                <th>同行者姓名</th>
                                <th>聯絡電話</th>
                                <th>備註</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="bookingTableBody"></tbody>
                    </table>
                </div>
            </div>

            <div id="calendarViewWrapper" class="box-container calendar-wrapper" style="display:none;">
                <div id="bookingCalendar"></div>
            </div>
        </div>

        <div id="section-member" class="section">
            <div class="header">
                <div><button class="btn btn-primary" onclick="loadMemberData()">🔄 重新整理清單</button></div>
            </div>
            <div class="controls">
                <input type="text" id="searchMemberInput" placeholder="🔍 搜尋會員姓名、電話或 LINE 暱稱..." onkeyup="filterMemberTable()" style="flex-grow: 1; max-width: 400px;">
                <div style="color:#888; font-size:14px; margin-left:10px;">總人數：<span id="memberCount" style="font-weight:bold; color:var(--primary-dark);">0</span> 人</div>
            </div>
            <div class="box-container" style="overflow-x: auto;">
                <table id="memberTable">
                    <thead>
                        <tr>
                            <th>會員姓名</th>
                            <th>聯絡電話</th>
                            <th>LINE 暱稱</th>
                            <th>初次來訪日</th>
                            <th>最後來訪日</th>
                            <th>累計次數</th>
                        </tr>
                    </thead>
                    <tbody id="memberTableBody"></tbody>
                </table>
            </div>
        </div>

        <div id="section-operating" class="section">
            <div class="header" style="background: #e8f5e9; padding: 15px; border-radius: 10px; color: #2e7d32;">
                <strong>💡 使用說明：</strong> 點擊日曆上的任何一天，即可切換該日期為「營業日 (綠色)」或「店休日 (空白)」。
            </div>
            <div class="box-container calendar-wrapper">
                <div id="operatingCalendar"></div> 
            </div>
        </div>

    </div>

    <script>
        // 🔴 請換成您的 GAS 網址
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbytizr6IDdZux7gaCZjYqiXVi0uQZELig_xaBagzNyDg84Wfi18IEZSYi7fTk3P3pFB/exec";
        const FRONTEND_URL = "https://liff.line.me/2009018559-AeGOURPY";
        const ADMIN_PASSWORD = "1234"; 

        let allBookings = []; 
        let allMembers = [];
        let allOperatingDays = []; 

        let currentFilterMode = 'today'; 
        let viewMode = 'list'; 
        let fcBookingCalendar = null; 
        let fcOperatingCalendar = null;
        let opCalendarLoaded = false;

        function checkLogin() {
            const pwd = document.getElementById('adminPwd').value;
            if (pwd === ADMIN_PASSWORD) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                loadBookingData(true); 
            } else {
                alert("密碼錯誤！");
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');

            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.getElementById(`section-${tabName}`).classList.add('active');

            if (tabName === 'member' && allMembers.length === 0) loadMemberData();
            
            if (tabName === 'operating') {
                if (!opCalendarLoaded) loadOperatingData();
                else if (fcOperatingCalendar) setTimeout(() => fcOperatingCalendar.render(), 50);
            }
            
            if (tabName === 'booking' && viewMode === 'calendar' && fcBookingCalendar) {
                setTimeout(() => fcBookingCalendar.render(), 50); 
            }
        }

        async function callApi(action, payload = {}) {
            const res = await fetch(GAS_API_URL, {
                method: "POST", headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({ action: action, payload: payload })
            });
            return await res.json();
        }

        // ================= 預約管理功能 =================
        function createNewBooking() { window.open(`${FRONTEND_URL}?role=admin`, '_blank'); }

        async function loadBookingData(isInit = false) {
            document.getElementById('loading').style.display = 'block';
            try {
                const res = await callApi("getAllBookings");
                if (res.status === "success") {
                    allBookings = res.data;
                    if (isInit) setQuickFilter('today');
                    else filterBookingTable(); 
                    if (fcBookingCalendar) fcBookingCalendar.refetchEvents();
                } else alert("讀取失敗：" + res.message);
            } catch (err) { alert("網路錯誤：" + err.message); }
            document.getElementById('loading').style.display = 'none';
        }

        function toggleViewMode() {
            if (viewMode === 'list') {
                viewMode = 'calendar';
                document.getElementById('listViewWrapper').style.display = 'none';
                document.getElementById('calendarViewWrapper').style.display = 'block';
                document.getElementById('viewToggleBtn').innerText = '切換至列表模式 📝';
                if (!fcBookingCalendar) initBookingCalendar();
                else setTimeout(() => fcBookingCalendar.render(), 50);
            } else {
                viewMode = 'list';
                document.getElementById('listViewWrapper').style.display = 'block';
                document.getElementById('calendarViewWrapper').style.display = 'none';
                document.getElementById('viewToggleBtn').innerText = '切換至日曆模式 📅';
            }
        }

        function initBookingCalendar() {
            const el = document.getElementById('bookingCalendar');
            fcBookingCalendar = new FullCalendar.Calendar(el, {
                initialView: 'timeGridWeek', locale: 'zh-tw',             
                slotMinTime: '10:00:00', slotMaxTime: '21:00:00', allDaySlot: false,           
                headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek,timeGridDay' },
                events: function(fetchInfo, successCallback) {
                    let events = allBookings.map(row => ({
                        id: row.id,
                        title: row.name + (row.name2 ? ` (+${row.name2})` : ""),
                        start: `${row.date}T${row.time}:00`,
                        backgroundColor: 'var(--primary-color)',
                        borderColor: 'var(--primary-dark)',
                        extendedProps: { phone: row.phone, remark: row.remark || '無', type: row.type }
                    }));
                    successCallback(events);
                },
                eventClick: function(info) { editBooking(info.event.id); },
                eventDidMount: function(info) {
                    info.el.title = `[${info.event.extendedProps.type}]\n姓名: ${info.event.title}\n電話: ${info.event.extendedProps.phone}\n備註: ${info.event.extendedProps.remark}`;
                }
            });
            fcBookingCalendar.render();
        }

        function setQuickFilter(mode) {
            currentFilterMode = mode;
            ['btn-today', 'btn-week', 'btn-month', 'btn-all'].forEach(id => {
                document.getElementById(id).classList.remove('btn-primary');
                document.getElementById(id).classList.add('btn-outline');
            });
            if (mode !== 'custom') {
                document.getElementById('dateFilter').value = '';
                if (document.getElementById(`btn-${mode}`)) {
                    document.getElementById(`btn-${mode}`).classList.remove('btn-outline');
                    document.getElementById(`btn-${mode}`).classList.add('btn-primary');
                }
            }
            filterBookingTable();
        }

        function getFormattedDate(d) {
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        function filterBookingTable() {
            const keyword = document.getElementById('searchBookingInput').value.toLowerCase();
            const today = new Date();
            const todayStr = getFormattedDate(today);
            const monthStr = todayStr.substring(0, 7); 
            
            const dayOfWeek = today.getDay() || 7; 
            const monday = new Date(today); monday.setDate(today.getDate() - dayOfWeek + 1);
            const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
            const wStart = getFormattedDate(monday);
            const wEnd = getFormattedDate(sunday);
            const customDate = document.getElementById('dateFilter').value;

            let filteredData = allBookings.filter(row => {
                const mKeyword = row.name.toLowerCase().includes(keyword) || row.phone.includes(keyword) || 
                                 (row.name2 && row.name2.toLowerCase().includes(keyword)) || (row.remark && row.remark.toLowerCase().includes(keyword));
                let mDate = true;
                if (currentFilterMode === 'today') mDate = (row.date === todayStr);
                else if (currentFilterMode === 'week') mDate = (row.date >= wStart && row.date <= wEnd);
                else if (currentFilterMode === 'month') mDate = row.date.startsWith(monthStr);
                else if (currentFilterMode === 'custom') mDate = (customDate === "" || row.date === customDate);
                return mKeyword && mDate;
            });

            if (currentFilterMode === 'all') filteredData.sort((a, b) => new Date(b.date+" "+b.time) - new Date(a.date+" "+a.time));
            else filteredData.sort((a, b) => new Date(a.date+" "+a.time) - new Date(b.date+" "+b.time));

            renderBookingTable(filteredData);
        }

        function renderBookingTable(data) {
            const tbody = document.getElementById('bookingTableBody');
            tbody.innerHTML = '';
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#888;">目前沒有符合的預約資料</td></tr>';
                return;
            }
            data.forEach(row => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${row.date}</strong> <br><span style="color:var(--primary-dark); font-size:18px; font-weight:bold;">${row.time}</span></td>
                    <td>${row.type}</td>
                    <td><strong style="color:#333;">${row.name}</strong></td>
                    <td>${row.name2 ? `<strong style="color:#333;">${row.name2}</strong>` : `<span style="color:#aaa;">-</span>`}</td>
                    <td>${row.phone}</td>
                    <td><div style="font-size:13px; color:#666; max-width:200px; white-space:pre-wrap; word-wrap:break-word;">${row.remark || '-'}</div></td>
                    <td class="action-btns">
                        <button class="btn btn-sm btn-edit" onclick="editBooking('${row.id}')">編輯</button>
                        <button class="btn btn-sm btn-cancel" onclick="cancelBooking('${row.id}')">取消</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function editBooking(id) { window.open(`${FRONTEND_URL}?role=admin&id=${id}`, '_blank'); }

        async function cancelBooking(id) {
            if (!confirm("確定要取消此筆預約嗎？\n(日曆與試算表資料將被刪除)")) return;
            document.getElementById('loading').style.display = 'block';
            const res = await callApi("cancelBooking", { id: id });
            if (res.status === "success") {
                allBookings = allBookings.filter(r => r.id !== id);
                filterBookingTable();
                if (fcBookingCalendar) fcBookingCalendar.refetchEvents();
            } else alert("取消失敗：" + res.message);
            document.getElementById('loading').style.display = 'none';
        }

        // ================= 會員清單功能 =================
        async function loadMemberData() {
            document.getElementById('loading').style.display = 'block';
            try {
                const res = await callApi("getAllMembers");
                if (res.status === "success") {
                    allMembers = res.data;
                    document.getElementById('memberCount').innerText = allMembers.length;
                    filterMemberTable(); 
                } else alert("讀取會員失敗：" + res.message);
            } catch (err) { alert("網路錯誤：" + err.message); }
            document.getElementById('loading').style.display = 'none';
        }

        function filterMemberTable() {
            const keyword = document.getElementById('searchMemberInput').value.toLowerCase();
            let filteredData = allMembers.filter(row => row.name.toLowerCase().includes(keyword) || row.phone.includes(keyword) || row.lineName.toLowerCase().includes(keyword));
            renderMemberTable(filteredData);
        }

        function renderMemberTable(data) {
            const tbody = document.getElementById('memberTableBody');
            tbody.innerHTML = '';
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#888;">查無會員資料</td></tr>';
                return;
            }
            data.forEach(row => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${row.name}</strong></td>
                    <td>${row.phone}</td>
                    <td style="color:#555;">${row.lineName || '-'}</td>
                    <td style="font-size:14px; color:#888;">${row.firstVisit}</td>
                    <td style="font-size:14px; color:#333;">${row.lastVisit}</td>
                    <td><strong style="color:var(--primary-dark); font-size:16px;">${row.count}</strong></td>
                `;
                tbody.appendChild(tr);
            });
        }

        // ================= 🔥 全新：互動式營業日曆設定 🔥 =================
        async function loadOperatingData() {
            document.getElementById('loading').style.display = 'block';
            try {
                const res = await callApi("getOperatingDays");
                if (res.status === "success") {
                    allOperatingDays = res.data;
                    if (!opCalendarLoaded) {
                        initOperatingCalendar();
                        opCalendarLoaded = true;
                    } else {
                        fcOperatingCalendar.refetchEvents();
                    }
                } else alert("讀取營業日失敗：" + res.message);
            } catch (err) { alert("網路錯誤：" + err.message); }
            document.getElementById('loading').style.display = 'none';
        }

        function initOperatingCalendar() {
            const el = document.getElementById('operatingCalendar');
            fcOperatingCalendar = new FullCalendar.Calendar(el, {
                initialView: 'dayGridMonth', // 使用整月檢視
                locale: 'zh-tw',
                headerToolbar: { left: 'prev,next today', center: 'title', right: '' },
                events: function(fetchInfo, successCallback) {
                    // 把設定的營業日標示成綠色背景
                    let events = allOperatingDays.map(date => ({
                        start: date,
                        title: '🟢 營業日',
                        allDay: true,
                        backgroundColor: '#4CAF50', // 綠色
                        borderColor: '#388E3C',
                        display: 'block' // 填滿格子
                    }));
                    successCallback(events);
                },
                dateClick: async function(info) {
                    // 🔥 點擊格子的互動邏輯
                    const clickedDate = info.dateStr; // 例如 "2026-03-15"
                    const isOperating = allOperatingDays.includes(clickedDate);
                    
                    if (isOperating) {
                        if(!confirm(`確定要將 【${clickedDate}】 設為 店休 (不開放預約) 嗎？`)) return;
                        document.getElementById('loading').style.display = 'block';
                        await callApi("removeOperatingDay", { date: clickedDate });
                    } else {
                        if(!confirm(`確定要將 【${clickedDate}】 設為 營業日 (開放預約) 嗎？`)) return;
                        document.getElementById('loading').style.display = 'block';
                        await callApi("addOperatingDay", { date: clickedDate });
                    }
                    // 操作完成後重新讀取最新狀態並渲染
                    await loadOperatingData();
                }
            });
            fcOperatingCalendar.render();
        }

    </script>
</body>
</html>
