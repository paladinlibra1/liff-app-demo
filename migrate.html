<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資料搬家工具 (Google Sheets ➔ Firebase)</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: '微軟正黑體', sans-serif; background-color: #f4f4f9; padding: 40px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); max-width: 500px; width: 100%; }
        h2 { color: #d68095; text-align: center; }
        .btn { width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; color: white; transition: 0.3s; }
        .btn-member { background-color: #4CAF50; }
        .btn-booking { background-color: #2196F3; }
        .btn-history { background-color: #9C27B0; }
        .btn-operating { background-color: #FF9800; }
        .btn:hover { filter: brightness(0.9); transform: translateY(-2px); }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; transform: none; }
        .status { margin-top: 10px; font-size: 14px; color: #666; text-align: center; min-height: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🚚 系統資料搬家工具</h2>
        <p style="color: #666; font-size: 14px; text-align: center;">請依序點擊下方按鈕，將 Google 試算表的資料轉移至 Firebase。</p>

        <button id="btn-member" class="btn btn-member" onclick="migrateData('getAllMembers', 'members')">1. 搬移【會員資料】</button>
        <div id="status-members" class="status">等待中...</div>

        <button id="btn-booking" class="btn btn-booking" onclick="migrateData('getAllBookings', 'bookings')">2. 搬移【未來的預約】</button>
        <div id="status-bookings" class="status">等待中...</div>

        <button id="btn-history" class="btn btn-history" onclick="migrateData('getHistoricalBookings', 'historicalBookings')">3. 搬移【歷史預約】</button>
        <div id="status-historicalBookings" class="status">等待中...</div>

        <button id="btn-operating" class="btn btn-operating" onclick="migrateData('getOperatingDays', 'operatingDays')">4. 搬移【營業日設定】</button>
        <div id="status-operatingDays" class="status">等待中...</div>
    </div>

    <script>
        // 🔴 您的 Firebase 金鑰
        const firebaseConfig = {
            apiKey: "AIzaSyAgCfJ7CSme4K4MR8Xb0Cjwt6Cuzu6JUVU",
            authDomain: "colorfashion-booking.firebaseapp.com",
            projectId: "colorfashion-booking",
            storageBucket: "colorfashion-booking.firebasestorage.app",
            messagingSenderId: "658886755238",
            appId: "1:658886755238:web:904c4a27bcc10b3b5f0567"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 🔴 您的 GAS 網址 (用來讀取舊資料)
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzpxsB2MFz5_3O-PH763lkOXDsBVhqXNMYm9cZVciP3Gba4N_DirAgPLyg1Aphmqf_b/exec";

        async function callApi(action) {
            const res = await fetch(GAS_API_URL, {
                method: "POST", headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({ action: action })
            });
            return await res.json();
        }

        async function migrateData(gasAction, collectionName) {
            const btnId = `btn-${collectionName === 'historicalBookings' ? 'history' : collectionName.replace('s','')}`;
            const btn = document.getElementById(btnId) || document.getElementById(`btn-${gasAction.replace('getAll','').replace('get','').toLowerCase()}`);
            const statusEl = document.getElementById(`status-${collectionName}`);
            
            btn.disabled = true;
            statusEl.innerText = "⏳ 正在從 Google 試算表讀取資料...";

            try {
                // 1. 從試算表抓資料
                const res = await callApi(gasAction);
                if (res.status !== "success") throw new Error(res.message);
                const dataArray = res.data;

                if (!dataArray || dataArray.length === 0) {
                    statusEl.innerText = "✅ 試算表中沒有資料，無需搬移。";
                    statusEl.style.color = "green";
                    return;
                }

                statusEl.innerText = `🚀 讀取到 ${dataArray.length} 筆資料，開始寫入 Firebase...`;

                // 2. 寫入 Firebase
                let count = 0;
                let batch = db.batch(); // 使用批次寫入提升速度
                let batchCount = 0;

                for (let i = 0; i < dataArray.length; i++) {
                    const item = dataArray[i];
                    let docRef;

                    // 依照不同的資料表，設定對應的 ID 與格式
                    if (collectionName === 'members') {
                        // 會員：以 LINE ID 作為文件 ID
                        if(!item.lineId) continue;
                        docRef = db.collection("members").doc(item.lineId);
                        batch.set(docRef, item);
                    } 
                    else if (collectionName === 'bookings' || collectionName === 'historicalBookings') {
                        // 預約紀錄：使用原本試算表產生的 id
                        if(!item.id) continue;
                        docRef = db.collection(collectionName).doc(item.id);
                        batch.set(docRef, item);
                    }
                    else if (collectionName === 'operatingDays') {
                        // 營業日：這支 API 傳回的是字串陣列 ["2026-03-01", "2026-03-02"]
                        docRef = db.collection("operatingDays").doc(item);
                        batch.set(docRef, { isOperating: true });
                    }

                    count++;
                    batchCount++;

                    // Firestore 批次寫入上限是 500 筆，滿了就先送出一次
                    if (batchCount === 400 || i === dataArray.length - 1) {
                        await batch.commit();
                        batch = db.batch(); // 重置批次
                        batchCount = 0;
                        statusEl.innerText = `⏳ 寫入進度：${count} / ${dataArray.length}...`;
                    }
                }

                statusEl.innerText = `🎉 搬家完成！成功轉移 ${count} 筆資料。`;
                statusEl.style.color = "green";

            } catch (err) {
                console.error(err);
                statusEl.innerText = "❌ 發生錯誤：" + err.message;
                statusEl.style.color = "red";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
