<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>皮膚構造 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#eef3f5; --bg2:#c9d7de; --ink:#1c2a33; --muted:#5a6b75;
  --panel:rgba(255,255,255,.93); --line:rgba(28,42,51,.12);
  --accent:#1d6d8b; --accent-ink:#fff; --accent-soft:rgba(29,109,139,.12);
  --shadow:0 10px 30px rgba(20,40,55,.16);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg1:#22323c; --bg2:#0e161b; --ink:#e6eef2; --muted:#9db0ba;
    --panel:rgba(22,32,39,.94); --line:rgba(230,238,242,.14);
    --accent:#68bfe0; --accent-ink:#0e161b; --accent-soft:rgba(104,191,224,.16);
    --shadow:0 10px 30px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg1:#22323c; --bg2:#0e161b; --ink:#e6eef2; --muted:#9db0ba;
  --panel:rgba(22,32,39,.94); --line:rgba(230,238,242,.14);
  --accent:#68bfe0; --accent-ink:#0e161b; --accent-soft:rgba(104,191,224,.16);
  --shadow:0 10px 30px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;overflow:hidden;color:var(--ink);
  background:radial-gradient(110% 75% at 50% 38%,var(--bg1),var(--bg2));
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
}
#app{position:relative;height:100%;width:100%;overflow:hidden}
#app canvas{display:block;touch-action:none;position:absolute;inset:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 16px 0;pointer-events:none}
.top>*{pointer-events:auto}
.title h1{margin:0;font-family:"Noto Serif TC","Songti TC",serif;font-weight:700;font-size:26px;letter-spacing:.06em;line-height:1.2}
.title p{margin:4px 0 0;font-size:13px;color:var(--muted);line-height:1.5}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--panel);box-shadow:var(--shadow);flex:none}
.icon-btn svg{width:20px;height:20px}

.toolbar{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;width:calc(100% - 20px);max-width:560px;display:grid;grid-template-columns:repeat(6,1fr);background:var(--panel);border-radius:20px;box-shadow:var(--shadow);padding:6px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.toolbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:14px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.toolbar button svg{width:22px;height:22px}
.toolbar button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}

.sheet{position:absolute;left:50%;transform:translateX(-50%);bottom:86px;width:calc(100% - 20px);max-width:520px;max-height:48%;overflow:auto;background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:16px 18px 14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:rise .22s ease-out}
.sheet[hidden]{display:none}
@keyframes rise{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.sheet h2{margin:0;font-family:"Noto Serif TC","Songti TC",serif;font-size:21px;letter-spacing:.04em}
.sheet .sub{margin:2px 0 0;font-size:13px;color:var(--muted);font-style:italic}
.sheet .body{margin:10px 0 0;font-size:15px;line-height:1.75}
.close{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.close:hover{background:var(--accent-soft)}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-size:14px}
.chip svg{width:16px;height:16px}
.chip.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}

.list-title{margin:14px 0 6px;font-size:13px;color:var(--muted);font-weight:500}
.list-title:first-of-type{margin-top:10px}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 2px;border-bottom:1px solid var(--line);font-size:15px}
.toggle-row:last-child{border-bottom:0}
.swatch{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:10px;vertical-align:-1px}
.switch{position:relative;width:46px;height:28px;border-radius:999px;background:var(--line);transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}

.tourbar{position:absolute;left:50%;transform:translateX(-50%);top:84px;display:flex;align-items:center;gap:8px;background:var(--panel);box-shadow:var(--shadow);border-radius:999px;padding:6px 6px 6px 14px;font-size:13px;white-space:nowrap}
.tourbar[hidden]{display:none}
.tourbar .chip{padding:6px 12px;font-size:13px}

.pin{position:absolute;left:0;top:0;pointer-events:none;will-change:transform}
.pin[hidden]{display:none}
.pin .dot{position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;background:var(--accent);border:2.5px solid #fff;box-shadow:0 0 0 6px var(--accent-soft)}
.pin .tag{position:absolute;left:12px;top:-40px;padding:5px 11px;border-radius:10px;background:var(--panel);box-shadow:var(--shadow);font-size:14px;font-weight:500;white-space:nowrap}
.pin .tag::before{content:"";position:absolute;left:-10px;bottom:-12px;width:14px;height:1.5px;background:var(--accent);transform:rotate(-55deg);transform-origin:right}
.layer-tag{position:absolute;left:0;top:0;pointer-events:none;font-size:13px;font-weight:500;padding:4px 10px;border-radius:8px;background:var(--panel);box-shadow:var(--shadow);white-space:nowrap;transform:translate(8px,-50%)}
.layer-tag[hidden]{display:none}

.kicker{margin:0 0 3px;font-size:13px;font-weight:500;color:var(--accent)}
.step-count{font-size:13px;color:var(--muted);margin-left:auto;align-self:center}
.chip:disabled{opacity:.4}
.prob-item{display:block;width:100%;text-align:left;padding:13px 2px;border-bottom:1px solid var(--line)}
.prob-item:last-child{border-bottom:0}
.prob-item b{display:block;font-size:16px;font-weight:500}
.prob-item span{display:block;margin-top:2px;font-size:13px;color:var(--muted)}
.story-tag{position:absolute;left:0;top:0;pointer-events:none;transform:translate(-50%,calc(-100% - 12px));padding:4px 10px;border-radius:8px;background:var(--panel);box-shadow:var(--shadow);font-size:13px;font-weight:500;white-space:nowrap}
.story-tag::after{content:"";position:absolute;left:50%;bottom:-18px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--accent);border:2px solid #fff}
#loading{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;color:var(--muted);transition:opacity .4s}
#loading.done{opacity:0;pointer-events:none}

@media (min-width:760px){
  .title h1{font-size:30px}
}
@media (prefers-reduced-motion:reduce){
  .sheet{animation:none}
}
</style>
</head>
<body>
<div id="app">
  <div id="loading">正在建立模型</div>

  <header class="top">
    <div class="title">
      <h1>皮膚構造</h1>
      <p id="hint">拖曳旋轉，雙指縮放，點一下構造看說明</p>
    </div>
    <button class="icon-btn" id="btnReset" aria-label="重設視角">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
  </header>

  <div class="tourbar" id="tourBar" hidden>
    <span id="tourCount">導覽</span>
    <button class="chip" id="tourPrev">上一個</button>
    <button class="chip" id="tourNext">下一個</button>
    <button class="chip primary" id="tourStop">結束</button>
  </div>

  <div class="pin" id="pin" hidden><div class="dot"></div><div class="tag" id="pinTag"></div></div>
  <div id="layerTags"></div>
  <div id="storyTags"></div>

  <section class="sheet" id="info" hidden aria-live="polite">
    <div class="sheet-head">
      <div><h2 id="infoTitle"></h2><p class="sub" id="infoSub"></p></div>
      <button class="close" id="infoClose" aria-label="關閉說明">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <p class="body" id="infoText"></p>
    <div class="actions">
      <button class="chip primary" id="btnSpeak">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        <span>朗讀</span>
      </button>
      <button class="chip" id="btnIsolate" aria-pressed="false">只看這個</button>
    </div>
  </section>

  <section class="sheet" id="layersPanel" hidden>
    <div class="sheet-head"><h2>顯示圖層</h2>
      <button class="close" data-close aria-label="關閉"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div id="layerList" style="margin-top:6px"></div>
  </section>

  <section class="sheet" id="catalogPanel" hidden>
    <div class="sheet-head"><h2>構造目錄</h2>
      <button class="close" data-close aria-label="關閉"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div id="catalogList"></div>
  </section>

  <section class="sheet" id="probPanel" hidden>
    <div class="sheet-head"><h2>皮膚問題</h2>
      <button class="close" data-close aria-label="關閉"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div style="margin-top:4px">
      <button class="prob-item" data-story="acne"><b>痘痘怎麼形成</b><span>從毛孔阻塞、粉刺到發炎紅腫，共 6 步</span></button>
      <button class="prob-item" data-story="spot"><b>斑怎麼形成</b><span>黑色素從製造到堆積成斑，共 5 步</span></button>
      <button class="prob-item" data-story="scar"><b>痘疤從哪裡來</b><span>痘印和痘疤的差別，四種痘疤類型，共 7 步</span></button>
      <button class="prob-item" data-story="sens"><b>皮膚為什麼會敏感</b><span>屏障受損、刺激物進入、泛紅刺癢，共 4 步</span></button>
      <button class="prob-item" data-story="dry"><b>乾燥與缺水</b><span>水分怎麼流失，乾性肌和缺水肌的差別，共 4 步</span></button>
      <button class="prob-item" data-story="fol"><b>毛囊炎</b><span>細菌感染毛囊，和痘痘的差別，共 4 步</span></button>
    </div>
  </section>

  <section class="sheet" id="story" hidden aria-live="polite">
    <div class="sheet-head">
      <div><p class="kicker" id="stTopic"></p><h2 id="stTitle"></h2></div>
      <button class="close" id="stClose" aria-label="結束說明"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <p class="body" id="stText"></p>
    <div class="actions">
      <button class="chip" id="stPrev">上一步</button>
      <button class="chip primary" id="stNext">下一步</button>
      <button class="chip" id="stSpeak" aria-label="朗讀"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>朗讀</button>
      <span class="step-count" id="stCount"></span>
    </div>
  </section>

  <nav class="toolbar" aria-label="工具列">
    <button data-act="layers" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg>圖層</button>
    <button data-act="catalog" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>目錄</button>
    <button data-act="xray" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>透視</button>
    <button data-act="explode" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="4" y="3" width="16" height="4" rx="1"/><rect x="4" y="10" width="16" height="4" rx="1"/><rect x="4" y="17" width="16" height="4" rx="1"/></svg>分層</button>
    <button data-act="tour" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m10 8.5 5.5 3.5-5.5 3.5z"/></svg>導覽</button>
    <button data-act="problems" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="9" cy="10" r="1.6"/><circle cx="15" cy="9" r="1.1"/><circle cx="13.5" cy="15" r="1.9"/></svg>皮膚問題</button>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
if(!window.THREE||!THREE.OrbitControls){$('#loading').textContent='3D 元件載入失敗，請檢查網路後重新整理';return;}

/* ---------------- 說明資料 ---------------- */
const INFO={
  corneum:{zh:'角質層',en:'Stratum corneum',g:'epi',text:'皮膚最外層，由已經角化、沒有細胞核的扁平細胞層層堆疊，像磚牆一樣鎖住水分、阻擋外來刺激。隨著表皮更新，老舊角質會逐漸自然脫落。'},
  epidermis:{zh:'表皮',en:'Epidermis',g:'epi',text:'位於角質層下方，主要由角質形成細胞組成。最底部的基底層會持續分裂，把細胞往上推，大約四週完成一次更新。這裡也有黑色素細胞，決定膚色並幫助抵擋紫外線。表皮本身沒有血管，養分靠下方的真皮供應。'},
  papillary:{zh:'真皮乳頭層',en:'Papillary dermis',g:'dermis',text:'真皮最上層，向上形成許多指狀突起，嵌進表皮底部，讓兩層接合得更牢固。這裡布滿微血管和觸覺小體，負責供應表皮養分，也負責感知輕微的碰觸。'},
  reticular:{zh:'真皮網狀層',en:'Reticular dermis',g:'dermis',text:'真皮中較厚的深層，膠原蛋白與彈力纖維交織成網，讓皮膚強韌又有彈性。年齡增長或長期日曬會讓這些纖維減少、斷裂，皮膚就會出現鬆弛和皺紋。'},
  fat:{zh:'皮下脂肪',en:'Subcutaneous fat',g:'fat',text:'由脂肪細胞聚集成小葉，中間有結締組織分隔。它能保持體溫、緩衝外力、儲存能量，也讓皮膚可以在深層組織上滑動。'},
  muscle:{zh:'肌肉層',en:'Fascia and muscle',g:'muscle',text:'皮下組織再往下是筋膜和骨骼肌。它不屬於皮膚本身，但為上方的皮膚提供支撐。'},
  hair:{zh:'毛幹',en:'Hair shaft',g:'hair',text:'露出皮膚表面的毛髮，由角蛋白構成，已經沒有活的細胞，所以剪頭髮不會痛。最外層的毛鱗片排列是否整齊，決定毛髮的光澤與觸感。'},
  follicle:{zh:'毛囊',en:'Hair follicle',g:'hair',text:'包覆毛髮根部的管狀構造，從表皮一路延伸到真皮深層。毛髮的生長期、退化期、休止期都在毛囊裡進行，底部膨大的毛球負責製造新的毛髮。'},
  papilla:{zh:'毛乳頭',en:'Dermal papilla',g:'hair',text:'位在毛球底部的小團組織，裡面有微血管供應養分，並發出訊號調控毛母細胞分裂。毛乳頭運作正常，毛髮才能持續生長。'},
  sebaceous:{zh:'皮脂腺',en:'Sebaceous gland',g:'gland',text:'附著在毛囊旁邊，分泌的皮脂沿著毛囊從毛孔排出，和汗水混合成皮脂膜，幫助保濕並維持皮膚的弱酸性。皮脂分泌過多或毛孔阻塞時，容易形成粉刺。'},
  arrector:{zh:'立毛肌',en:'Arrector pili muscle',g:'hair',text:'連接毛囊與真皮上層的小束平滑肌。遇冷或緊張時會收縮，把毛髮拉直，皮膚表面就出現雞皮疙瘩，同時也會擠壓皮脂腺幫助皮脂排出。'},
  sweat:{zh:'汗腺',en:'Eccrine sweat gland',g:'gland',text:'盤繞成一團的腺體位在真皮深層，汗液沿著細長的導管往上，以螺旋狀穿過表皮，從汗孔排出。主要功能是靠汗水蒸發來調節體溫。'},
  artery:{zh:'動脈',en:'Artery',g:'vessel',text:'把含氧血液送進皮膚，在真皮與皮下脂肪交界處，以及乳頭層下方各形成一層血管網，再分出微血管供應毛囊、腺體和表皮。'},
  vein:{zh:'靜脈',en:'Vein',g:'vessel',text:'收集回流的缺氧血液，大多與動脈並行。皮膚血管的收縮與擴張也參與體溫調節，例如天熱時皮膚會泛紅。'},
  nerve:{zh:'神經',en:'Nerve',g:'nerve',text:'把觸碰、壓力、溫度、疼痛和癢的感覺傳回大腦，也負責控制汗腺與立毛肌。末端連接各種感覺接受器。'},
  meissner:{zh:'觸覺小體',en:"Meissner's corpuscle",g:'nerve',text:'位在真皮乳頭裡的橢圓形接受器，對輕觸和低頻振動特別敏感，在指尖和嘴唇分布最密集。'},

  {key:'muscle',top:musTop,bot:musBot,side:()=>tMus,topT:()=>tMus,off:-2.3}

const TS=2;
function layerGeo(topFn,botFn,sx,sz){
  const g=new THREE.BoxGeometry(W,1,D,sx||110,1,sz||77);
  const p=g.attributes.position,n=g.attributes.normal,uv=g.attributes.uv;
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),z=p.getZ(i),y=p.getY(i)>0?topFn(x,z):botFn(x,z);
    p.setY(i,y);
    const nx=n.getX(i),ny=n.getY(i);
    if(Math.abs(nx)>.5)uv.setXY(i,z/TS,y/TS);
    else if(Math.abs(ny)>.5)uv.setXY(i,x/TS,z/TS);
    else uv.setXY(i,x/TS,y/TS);
  }
  g.computeVertexNormals();
  return g;
}
function tissueMat(tex,key){

}
function buildLayers(){
  LAYERS.forEach(L=>{

    visGroups[INFO[L.key].g].add(grp);
    const side=tissueMat(L.side(),L.key);
    const top=L.key==='corneum'?reg(new THREE.MeshStandardMaterial({map:L.topT(),bumpMap:L.topT(),bumpScale:0.02,roughness:0.62,metalness:0}),L.key,'tissue'):side;
    const fine=['corneum','epidermis','papillary','reticular'].indexOf(L.key)>=0;
    const mesh=new THREE.Mesh(layerGeo(L.top,L.bot,fine?170:110,fine?119:77),[side,side,top,side,side,side]);layerMeshes[L.key]=mesh;
    addMesh(mesh,L.key,grp);
  });
  // 脂肪小葉立體顆粒（切面）
  const pts=[];
  for(let x=-4.92;x<=4.92;x+=0.2)for(let k=0;k<12;k++){
    const xx=x+rr(-.06,.06),ft=fatTop(xx,HZ),mt=musTop(xx,HZ),y=mt+0.1+(ft-mt-0.2)*(k+R()*.6)/12;
    const r=rr(.085,.12);pts.push([xx,y,HZ-r*.5,r]);
  }
  for(let z=-3.42;z<=3.3;z+=0.2)for(let k=0;k<12;k++){
    const zz=z+rr(-.06,.06),ft=fatTop(HX,zz),mt=musTop(HX,zz),y=mt+0.1+(ft-mt-0.2)*(k+R()*.6)/12;
    const r=rr(.085,.12);pts.push([HX-r*.5,y,zz,r]);

/* ---------------- 幾何工具 ---------------- */
function tube(pts,rFn,seg,rad){
  const curve=new THREE.CatmullRomCurve3(pts,false,'centripetal');
  const fr=curve.computeFrenetFrames(seg,false);
  const pos=[],nor=[],idx=[],P=new V(),N=new V();
  for(let i=0;i<=seg;i++){
    const t=i/seg;curve.getPointAt(t,P);const r=rFn(t),n=fr.normals[i],b=fr.binormals[i];
    for(let j=0;j<=rad;j++){
      const v=j/rad*Math.PI*2,c=Math.cos(v),s=Math.sin(v);
      N.set(c*n.x+s*b.x,c*n.y+s*b.y,c*n.z+s*b.z).normalize();
      pos.push(P.x+r*N.x,P.y+r*N.y,P.z+r*N.z);nor.push(N.x,N.y,N.z);
    }
  }
  for(let i=0;i<seg;i++)for(let j=0;j<rad;j++){const a=i*(rad+1)+j,b2=a+rad+1;idx.push(a,a+1,b2,b2,a+1,b2+1);}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  g.setIndex(idx);return g;
}
const UP=new V(0,1,0);
function ellipsoid(c,sx,sy,sz,dir,ws,hs){
  const g=new THREE.SphereGeometry(1,ws||16,hs||12);
  const q=new THREE.Quaternion();if(dir)q.setFromUnitVectors(UP,dir.clone().normalize());
  g.applyMatrix4(new THREE.Matrix4().compose(c,q,new V(sx,sy,sz)));
  g.deleteAttribute('uv');return g;
}
function colorize(g,hex){const c=lin(hex),n=g.attributes.position.count,a=new Float32Array(n*3);for(let i=0;i<n;i++){a[i*3]=c.r;a[i*3+1]=c.g;a[i*3+2]=c.b;}g.setAttribute('color',new THREE.BufferAttribute(a,3));return g;}
function merge(geos){
  let nV=0,nI=0;const hasC=geos.some(g=>g.attributes.color);
  geos.forEach(g=>{nV+=g.attributes.position.count;nI+=g.index.count;});
  const pos=new Float32Array(nV*3),nor=new Float32Array(nV*3),col=hasC?new Float32Array(nV*3):null,idx=new Uint32Array(nI);
  let vo=0,io=0;
  geos.forEach(g=>{
    const n=g.attributes.position.count;
    pos.set(g.attributes.position.array,vo*3);nor.set(g.attributes.normal.array,vo*3);
    if(col){if(g.attributes.color)col.set(g.attributes.color.array,vo*3);else col.fill(1,vo*3,(vo+n)*3);}
    const ia=g.index.array;for(let k=0;k<ia.length;k++)idx[io+k]=ia[k]+vo;
    vo+=n;io+=ia.length;g.dispose();
  });
  const out=new THREE.BufferGeometry();
  out.setAttribute('position',new THREE.BufferAttribute(pos,3));
  out.setAttribute('normal',new THREE.BufferAttribute(nor,3));
  if(col)out.setAttribute('color',new THREE.BufferAttribute(col,3));
  out.setIndex(new THREE.BufferAttribute(idx,1));
  out.computeBoundingSphere();return out;
}
const B={},ANCH={};
const add=(key,g)=>{(B[key]=B[key]||[]).push(g);};
const anchor=(key,v)=>{if(!ANCH[key])ANCH[key]=v.clone();};

/* ---------------- 毛髮、毛囊、皮脂腺、立毛肌 ---------------- */
function follicle(fx,fz,dir2,h,front,fwd){
  const F=fwd?fwd.clone():new V();
  const by=-2.02+rr(-.14,.06);
  const Bp=new V(fx,by,fz);
  const S=new V(fx+dir2.x*h,0,fz+dir2.z*h);S.y=surf(S.x,S.z);
  const axis=S.clone().sub(Bp).normalize();
  const side=new V(-dir2.z,0,dir2.x);
  const wig=front?0:0.05;
  const pts=[Bp.clone(),Bp.clone().lerp(S,.35).addScaledVector(side,rr(-wig,wig)),Bp.clone().lerp(S,.7),S.clone(),S.clone().addScaledVector(axis,.06)];
  add('follicle',tube(pts,t=>t<.85?0.165-0.05*t:0.123+(t-.85)*0.5,30,14));
  add('follicle',ellipsoid(Bp.clone().addScaledVector(axis,-.02),.215,.29,.215,axis,18,14));
  add('papilla',ellipsoid(Bp.clone().addScaledVector(axis,-.1).addScaledVector(F,.13),.1,.14,.1,axis,14,10));
  // 毛幹
  const e=dir2.clone().multiplyScalar(.95).add(UP).normalize();
  const Lh=rr(1.6,2.7),inLen=S.distanceTo(Bp);
  const hp=[Bp.clone().addScaledVector(axis,.02).addScaledVector(F,.15),Bp.clone().lerp(S,.5).addScaledVector(F,.13),S.clone().addScaledVector(F,.11),
    S.clone().addScaledVector(e,Lh*.35),
    S.clone().addScaledVector(e,Lh*.7).addScaledVector(dir2,Lh*.08).addScaledVector(UP,-Lh*.05),
    S.clone().addScaledVector(e,Lh).addScaledVector(dir2,Lh*.22).addScaledVector(UP,-Lh*.2)];
  const f0=inLen/(inLen+Lh*1.05);
  hp.slice(3).forEach(q=>q.addScaledVector(F,.11));
  add('hair',tube(hp,t=>t<f0?0.05:0.006+0.044*Math.pow(1-(t-f0)/(1-f0),0.75),64,8));
  // 皮脂腺
  const Q=Bp.clone().lerp(S,(0.02-by)/(S.y-by));
  const G=Q.clone().addScaledVector(dir2,.25);
  const lat=front?0:1;
  [[0,0,0,.15],[.1,-.16,.05,.13],[.03,.13,-.05,.11],[-.02,-.3,0,.1],[.16,-.02,-.06,.1],[-.12,-.08,0,.07]].forEach(s=>{
    const c=G.clone().addScaledVector(dir2,s[0]).add(new V(0,s[1],0)).addScaledVector(side,s[2]*lat);
    add('sebaceous',ellipsoid(c,s[3],s[3]*1.05,s[3],null,14,10));
  });
  // 立毛肌
  const a0=Bp.clone().lerp(S,(-1.05-by)/(S.y-by)).addScaledVector(dir2,.13);
  const a2=a0.clone().addScaledVector(dir2,1.0);a2.y=papTop(a2.x,a2.z)-0.13;
  const a1=a0.clone().lerp(a2,.5).addScaledVector(UP,.06);
  add('arrector',tube([a0,a1,a2],t=>0.022+0.095*Math.pow(Math.sin(Math.PI*t),0.8),26,12));
  if(front&&fwd&&fwd.z>0)FOLS.push({fx,Bp,S,axis,G:G.clone()});
  if(front){
    anchor('follicle',Bp.clone().lerp(S,.42));anchor('papilla',Bp);anchor('sebaceous',G);
    anchor('arrector',a1);anchor('hair',S.clone().addScaledVector(e,Lh*.45));
  }
}
function buildHair(){
  const X=new V(1,0,0);
  [-2.75,0.3,2.85].forEach(x=>follicle(x,HZ-.05,X,.55,true,new V(0,0,1)));
  [1.1,-1.9].forEach(z=>follicle(HX-.05,z,new V(0,0,-1),.55,true,new V(1,0,0)));
  const spots=[];let guard=0;
  while(spots.length<30&&guard++<2000){
    const x=rr(-4.6,3.9),z=rr(-3.25,2.75);
    if(spots.some(s=>Math.hypot(s[0]-x,s[1]-z)<0.95))continue;
    spots.push([x,z]);
  }
  spots.forEach(s=>{const a=rr(-.55,.45);follicle(s[0],s[1],new V(Math.cos(a),0,Math.sin(a)),rr(.45,.7),false);});
}

function sweat(c,plane){
  const pts=[],N=48;
  for(let i=0;i<N;i++){
    const a=i*.6;

function surfaceSheet(x0,x1,z0,z1,col,lift){

  const p=g.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i)+(x0+x1)/2,z=p.getZ(i)+(z0+z1)/2;p.setXYZ(i,x,surf(x,z)+lift,z);}
  g.computeVertexNormals();
  return new THREE.Mesh(g,solid(col,{roughness:.12,metalness:0,depthWrite:false,side:THREE.DoubleSide}));
}

      {h:'冰鑿型痘疤',text:'開口窄、深度深，像用冰鑿刺出的小洞，可能深達真皮深層。開口雖小卻很深，是處理難度最高的一種。',dent:[1,0,0,0],labels:[['冰鑿型',C.ice]],cam:{t:new V(-3.6,.95,HZ),w:1.1,h:1}},
      {h:'箱型痘疤',text:'洞口較寬、邊緣清楚陡直、底部平坦，像一個小箱子，常見於臉頰和太陽穴。',dent:[1,1,0,0],labels:[['箱型',C.box]],cam:{t:new V(-1.0,1.0,HZ),w:1.1,h:1}},
      {h:'滾輪型痘疤',text:'範圍較寬、邊緣平緩，表面呈波浪狀起伏。原因是真皮下方形成纖維帶，把皮膚往下拉住。',dent:[1,1,1,0],ov:{tether:1},labels:[['滾輪型',C.roll],['纖維牽拉',C.tether]],cam:{t:new V(1.9,.2,HZ),w:1.5,h:1.9}},
      {h:'凸起型痘疤',text:'如果修復時膠原蛋白做得太多，就會形成凸起的肥厚性疤痕；超出原本傷口範圍的叫蟹足腫，和體質有關，常見於下巴、胸口和肩背。',dent:[1,1,1,1],labels:[['肥厚性疤痕',C.raise]],cam:{t:new V(4.05,1.1,HZ),w:1.1,h:1}},
      {h:'怎麼減少留疤',text:'及早處理發炎的痘痘、不要擠壓或摳抓、做好防曬避免痘印變深，都能降低留疤機會。已經形成的凹洞或凸疤，保養品無法填平，需要由皮膚科醫師評估適合的治療。',dent:[1,1,1,1],ov:{tether:1},labels:[['冰鑿型',C.ice],['箱型',C.box],['滾輪型',C.roll],['凸起型',C.raise]],cam:{t:new V(.2,.6,HZ),w:4.6,h:1.6}}
    ]}
  };
}
const story={on:false,id:null,i:0};
const stSheet=$('#story'),stTopic=$('#stTopic'),stTitle=$('#stTitle'),stText=$('#stText'),stCount=$('#stCount'),stPrev=$('#stPrev'),stNext=$('#stNext');
const tagBox=$('#storyTags');let storyTags=[];
function setStoryLabels(list){
  tagBox.innerHTML='';storyTags=list.map(l=>{const el=document.createElement('div');el.className='story-tag';el.textContent=l[0];tagBox.appendChild(el);return{el,pos:l[1]};});
}
function startStory(id){
  if(tour.on)stopTour();setXray(false);setExplode(false);state.isolate=null;deselect();closePanels();
  story.on=true;story.id=id;story.i=0;stSheet.hidden=false;toolBtns.problems.setAttribute('aria-pressed','true');showStep();
}
function endStory(silent){
  if(!story.on)return;
  story.on=false;stSheet.hidden=true;stopSpeak();
  Object.keys(OV).forEach(k=>{OV[k].userData.t=0;});DENT.tgt=[0,0,0,0];setStoryLabels([]);
  toolBtns.problems.setAttribute('aria-pressed','false');
  if(!silent)resetView();
}
function showStep(){
  const S=STORIES[story.id],st=S.steps[story.i];
  stTopic.textContent=S.title;stTitle.textContent=st.h;stText.textContent=st.text;
  stCount.textContent=`${story.i+1} / ${S.steps.length}`;
  stPrev.disabled=story.i===0;stNext.textContent=story.i===S.steps.length-1?'完成':'下一步';
  Object.keys(OV).forEach(id=>{const v=st.ov&&st.ov[id],u=OV[id].userData;if(v===undefined){u.t=0;}else if(Array.isArray(v)){u.t=v[0];u.ts=v[1];}else{u.t=v;u.ts=1;}});
  DENT.tgt=(st.dent||[0,0,0,0]).slice();
  setStoryLabels(st.labels||[]);
  const cam=st.cam||S.cam,dir=(st.dir||S.dir).clone().normalize();
  const vh=app.clientHeight,avail=Math.max(180,vh-stSheet.offsetHeight-176),k=vh/avail;
  flyPose(cam.t.clone().addScaledVector(dir,fitDist(cam.w*1.15,(cam.h||cam.w)*k)),cam.t,1100);
  stopSpeak();stText.parentElement.scrollTop=0;
}
stPrev.onclick=()=>{if(story.i>0){story.i--;showStep();}};
stNext.onclick=()=>{const n=STORIES[story.id].steps.length;if(story.i<n-1){story.i++;showStep();}else endStory();};
$('#stClose').onclick=()=>endStory();
$('#stSpeak').onclick=()=>{const st=STORIES[story.id].steps[story.i];speak(st.h+'。'+st.text);};
document.querySelectorAll('[data-story]').forEach(b=>b.onclick=()=>startStory(b.dataset.story));
function tickStory(now){
  Object.keys(OV).forEach(id=>{
    const m=OV[id],u=m.userData;
    u.op+=(u.t-u.op)*.12;if(Math.abs(u.t-u.op)<.004)u.op=u.t;
    m.visible=u.op>.01;
    if(m.visible&&m.userData.anim)m.userData.anim(now);
    m.material.opacity=u.op*m.material.userData.baseOp*(u.pulse?(.6+.4*Math.sin(now*.006)):1);
    if(!u.basic)m.material.depthWrite=u.op>.6;
    const s=m.scale.x+(u.ts-m.scale.x)*.1;m.scale.setScalar(Math.abs(u.ts-s)<.002?u.ts:s);
  });
  let ch=false;
  for(let j=0;j<4;j++){const d=DENT.tgt[j]-DENT.amt[j];if(Math.abs(d)>.003){DENT.amt[j]+=d*.1;ch=true;}else if(DENT.amt[j]!==DENT.tgt[j]){DENT.amt[j]=DENT.tgt[j];ch=true;}}
  if(ch)applyDent();
  storyTags.forEach(t=>{const p=project(t.pos);if(p.z<1){t.el.style.display='';t.el.style.left=p.x+'px';t.el.style.top=p.y+'px';}else t.el.style.display='none';});
}

/* ---------------- 地面陰影 ---------------- */
function buildShadow(){
  const t=canvasTex((g,s)=>{const gr=g.createRadialGradient(s/2,s/2,s*.08,s/2,s/2,s*.5);gr.addColorStop(0,'rgba(20,35,45,.38)');gr.addColorStop(1,'rgba(20,35,45,0)');g.fillStyle=gr;g.fillRect(0,0,s,s);},256);
  t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping;
  const m=new THREE.Mesh(new THREE.PlaneGeometry(17,13),new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false}));
  m.rotation.x=-Math.PI/2;m.position.y=-5.45;scene.add(m);
}

/* ---------------- 狀態與互動 ---------------- */
const state={sel:null,isolate:null,xray:false,explode:false,pinPoint:null};
const pin=$('#pin'),pinTag=$('#pinTag');
const info=$('#info'),infoTitle=$('#infoTitle'),infoSub=$('#infoSub'),infoText=$('#infoText'),btnIso=$('#btnIsolate');
const panels={layers:$('#layersPanel'),catalog:$('#catalogPanel'),problems:$('#probPanel')};
const toolBtns={};document.querySelectorAll('.toolbar button').forEach(b=>toolBtns[b.dataset.act]=b);

function closePanels(){Object.keys(panels).forEach(k=>{panels[k].hidden=true;toolBtns[k].setAttribute('aria-pressed','false');});}
function openPanel(k){const was=!panels[k].hidden;closePanels();if(was)return;info.hidden=true;panels[k].hidden=false;toolBtns[k].setAttribute('aria-pressed','true');}

function select(key,point,focus){
  state.sel=key;
  const I=INFO[key];
  state.pinPoint=(point||ANCH[key]||new V(0,0,HZ)).clone();
  pinTag.textContent=I.zh;
  infoTitle.textContent=I.zh;infoSub.textContent=I.en;infoText.textContent=I.text;
  closePanels();info.hidden=false;
  btnIso.setAttribute('aria-pressed',String(state.isolate===key));
  btnIso.textContent=state.isolate===key?'顯示全部':'只看這個';
  if(focus)flyTo(state.pinPoint,focusDist());
}
function deselect(){state.sel=null;state.pinPoint=null;info.hidden=true;pin.hidden=true;if(state.isolate&&!tour.on){state.isolate=null;}}
function setIsolate(k){state.isolate=k;if(k&&state.explode)setExplode(false);btnIso.setAttribute('aria-pressed',String(!!k&&k===state.sel));btnIso.textContent=k&&k===state.sel?'顯示全部':'只看這個';}
function setXray(on){state.xray=on;toolBtns.xray.setAttribute('aria-pressed',String(on));if(on&&state.explode)setExplode(false);}
function setExplode(on){state.explode=on;toolBtns.explode.setAttribute('aria-pressed',String(on));if(on){state.isolate=null;if(state.xray)setXray(false);if(state.sel&&INFO[state.sel]&&SM[state.sel])deselect();}}

/* 相機動畫 */
let fly=null;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function flyPose(pos,tgt,dur){fly={t0:performance.now(),dur:dur||900,fp:camera.position.clone(),tp:pos.clone(),ft:controls.target.clone(),tt:tgt.clone()};}
function flyTo(tgt,dist){const dir=camera.position.clone().sub(controls.target).normalize();flyPose(tgt.clone().addScaledVector(dir,dist),tgt);}
function fitDist(halfW,halfH){const vf=camera.fov*Math.PI/360;const hf=Math.atan(Math.tan(vf)*camera.aspect);return Math.max(halfW/Math.tan(hf),halfH/Math.tan(vf));}
function focusDist(){return Math.max(6,fitDist(2.6,2.2));}
function defaultPose(){const tgt=new V(0,-1.35,0),dir=new V(.56,.42,.72).normalize();return{pos:tgt.clone().addScaledVector(dir,fitDist(7.4,6.4)),tgt};}
controls.addEventListener('start',()=>{fly=null;});

/* 點選 */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function visibleDeep(o){while(o){if(!o.visible)return false;o=o.parent;}return true;}
function pick(cx,cy){
  const r=canvas.getBoundingClientRect();
  ndc.set((cx-r.left)/r.width*2-1,-((cy-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  const cands=pickables.filter(o=>{const m=Array.isArray(o.material)?o.material[0]:o.material;return m.opacity>.3&&visibleDeep(o);});
  const hits=ray.intersectObjects(cands,false);
  for(const h of hits){
    const m=Array.isArray(h.object.material)?h.object.material[0]:h.object.material;
    if(m.clippingPlanes&&(h.point.x>HX+PO+.001||h.point.z>HZ+PO+.001))continue;
    return h;
  }
  return null;
}
let down=null;
canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,t:performance.now(),id:e.pointerId};});
canvas.addEventListener('pointerup',e=>{
  if(!down||down.id!==e.pointerId)return;
  const dx=e.clientX-down.x,dy=e.clientY-down.y;
  if(!story.on&&dx*dx+dy*dy<64&&performance.now()-down.t<450){
    if(tour.on)stopTour();
    const h=pick(e.clientX,e.clientY);
    if(h)select(h.object.userData.key,h.point,false);else deselect();
  }
  down=null;
});

/* 語音 */
let voice=null;
function loadVoice(){if(!('speechSynthesis'in window))return;const vs=speechSynthesis.getVoices();voice=vs.find(v=>/zh[-_]TW/i.test(v.lang))||vs.find(v=>/zh[-_](HK|Hant)/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null;}
if('speechSynthesis'in window){loadVoice();speechSynthesis.onvoiceschanged=loadVoice;}
let speakTimer=null;
function speak(text,onend){
  clearTimeout(speakTimer);
  let done=false;const fin=()=>{if(done)return;done=true;clearTimeout(speakTimer);onend&&onend();};
  if(!('speechSynthesis'in window)){if(onend)speakTimer=setTimeout(fin,Math.max(4500,text.length*230));return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';if(voice)u.voice=voice;u.rate=1;
  u.onend=fin;u.onerror=fin;
  setTimeout(()=>speechSynthesis.speak(u),60);
  if(onend)speakTimer=setTimeout(fin,text.length*320+3500);
}
function stopSpeak(){clearTimeout(speakTimer);if('speechSynthesis'in window)speechSynthesis.cancel();}

/* 導覽 */
const tour={on:false,i:0,token:0};
const tourBar=$('#tourBar'),tourCount=$('#tourCount');
function startTour(){if(state.explode)setExplode(false);if(state.xray)setXray(false);tour.on=true;tour.i=0;tourBar.hidden=false;toolBtns.tour.setAttribute('aria-pressed','true');tourStep();}
function stopTour(){tour.on=false;tour.token++;stopSpeak();tourBar.hidden=true;toolBtns.tour.setAttribute('aria-pressed','false');state.isolate=null;btnIso.setAttribute('aria-pressed','false');btnIso.textContent='只看這個';}
function tourStep(){
  if(!tour.on)return;
  if(tour.i<0)tour.i=0;
  if(tour.i>=TOUR.length){stopTour();resetView();return;}
  const k=TOUR[tour.i],I=INFO[k],my=++tour.token;
  tourCount.textContent=`導覽 ${tour.i+1}/${TOUR.length}`;
  state.isolate=k;select(k,ANCH[k],true);
  speak(I.zh+'。'+I.text,()=>{if(tour.on&&tour.token===my){setTimeout(()=>{if(tour.on&&tour.token===my){tour.i++;tourStep();}},700);}});
}
$('#tourNext').onclick=()=>{tour.i++;tourStep();};
$('#tourPrev').onclick=()=>{tour.i--;tourStep();};
$('#tourStop').onclick=()=>{stopTour();};

/* 按鈕 */
toolBtns.problems.onclick=()=>{if(story.on){endStory();return;}openPanel('problems');};
document.querySelectorAll('.toolbar button').forEach(b=>{if(b.dataset.act!=='problems'&&b.dataset.act!=='layers')b.addEventListener('click',()=>endStory(true),true);});
toolBtns.layers.onclick=()=>openPanel('layers');
toolBtns.catalog.onclick=()=>openPanel('catalog');
toolBtns.xray.onclick=()=>{if(tour.on)stopTour();state.isolate=null;setXray(!state.xray);};
toolBtns.explode.onclick=()=>{if(tour.on)stopTour();setExplode(!state.explode);if(state.explode)flyPose(defaultPose().pos.clone().multiplyScalar(1.12),new V(0,-1.2,0));};
toolBtns.tour.onclick=()=>{closePanels();tour.on?stopTour():startTour();};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closePanels);
$('#infoClose').onclick=()=>{if(tour.on)stopTour();deselect();};
$('#btnSpeak').onclick=()=>{if(state.sel){const I=INFO[state.sel];speak(I.zh+'。'+I.text);}};
btnIso.onclick=()=>{if(!state.sel)return;if(tour.on)stopTour();setIsolate(state.isolate===state.sel?null:state.sel);};
function resetView(){const p=defaultPose();flyPose(p.pos,p.tgt,1000);}
$('#btnReset').onclick=()=>{endStory(true);if(tour.on)stopTour();setXray(false);setExplode(false);state.isolate=null;deselect();resetView();};

/* 圖層面板 */
function buildPanels(){
  const ll=$('#layerList');
  GROUPS.forEach(g=>{
    const row=document.createElement('div');row.className='toggle-row';
    row.innerHTML=`<span><span class="swatch" style="background:${g.sw}"></span>${g.zh}</span>`;
    const sw=document.createElement('button');sw.className='switch';sw.setAttribute('role','switch');sw.setAttribute('aria-checked','true');sw.setAttribute('aria-label',g.zh);
    sw.onclick=()=>{const on=sw.getAttribute('aria-checked')!=='true';sw.setAttribute('aria-checked',String(on));visGroups[g.id].visible=on;};
    row.appendChild(sw);ll.appendChild(row);
  });
  const cl=$('#catalogList');
  GROUPS.forEach(g=>{
    const keys=Object.keys(INFO).filter(k=>INFO[k].g===g.id);if(!keys.length)return;
    const h=document.createElement('div');h.className='list-title';h.textContent=g.zh;cl.appendChild(h);
    const wrap=document.createElement('div');wrap.className='grid';
    keys.forEach(k=>{const b=document.createElement('button');b.className='chip';b.textContent=INFO[k].zh;
      b.onclick=()=>{if(tour.on)stopTour();if(!visGroups[g.id].visible){visGroups[g.id].visible=true;const s=ll.querySelector(`[aria-label="${g.zh}"]`);if(s)s.setAttribute('aria-checked','true');}
        if(state.explode&&SM[k])setExplode(false);select(k,ANCH[k],true);};
      wrap.appendChild(b);});
    cl.appendChild(wrap);
  });
}

/* 分層標籤 */
const layerTagEls={};
function buildLayerTags(){
  const box=$('#layerTags');
  LAYERS.forEach(L=>{const el=document.createElement('div');el.className='layer-tag';el.hidden=true;el.textContent=INFO[L.key].zh;box.appendChild(el);layerTagEls[L.key]=el;});
}

/* ---------------- 渲染迴圈 ---------------- */
const tmp=new V();
function project(v){tmp.copy(v).project(camera);const r=canvas.getBoundingClientRect();return{x:(tmp.x*.5+.5)*r.width,y:(-tmp.y*.5+.5)*r.height,z:tmp.z};}
const hiCol=new THREE.Color(.1,.42,.62);
function targetOp(m){
  const u=m.userData;
  if(story.on)return u.kind==='tissue'?1:(STORIES[story.id].show.indexOf(u.key)>=0?1:0);
  if(state.isolate)return u.key===state.isolate?1:(u.kind==='tissue'?.06:.07);
  if(state.explode)return u.kind==='tissue'?1:0;
  if(state.xray)return u.kind==='tissue'?.13:1;
  return 1;
}
function tick(now){
  requestAnimationFrame(tick);
  if(fly){const k=Math.min(1,(now-fly.t0)/fly.dur),e=ease(k);camera.position.lerpVectors(fly.fp,fly.tp,e);controls.target.lerpVectors(fly.ft,fly.tt,e);if(k>=1)fly=null;}
  controls.update();
  const pulse=.55+.45*Math.sin(now*.005);
  MATS.forEach(m=>{
    const u=m.userData,t=targetOp(m);
    u.op+=(t-u.op)*.14;if(Math.abs(t-u.op)<.004)u.op=t;
    m.opacity=u.op;
    const tr=u.op<.995;if(m.transparent!==tr){m.transparent=tr;m.needsUpdate=true;}
    m.depthWrite=u.op>.5;
    u.meshes.forEach(ms=>{ms.visible=u.op>.01;});
    if(m.emissive){if(u.key===state.sel)m.emissive.copy(hiCol).multiplyScalar(.35*pulse);else if(m.emissive.r||m.emissive.g||m.emissive.b)m.emissive.setRGB(0,0,0);}
  });
  LAYERS.forEach(L=>{const g=tissueGroups[L.key];if(!g)return;const ty=state.explode?L.off:0;g.position.y+=(ty-g.position.y)*.12;if(Math.abs(ty-g.position.y)<.002)g.position.y=ty;});
  // 標記
  if(state.pinPoint&&!(state.explode&&SM[state.sel])){
    const off=(state.sel&&tissueGroups[state.sel])?tissueGroups[state.sel].position.y:0;
    const p=project(tmp.copy(state.pinPoint).add(new V(0,off,0)));
    if(p.z<1){pin.hidden=false;pin.style.transform=`translate(${p.x}px,${p.y}px)`;}else pin.hidden=true;
  }else pin.hidden=true;
  LAYERS.forEach(L=>{
    const el=layerTagEls[L.key];if(!el)return;
    const show=state.explode&&tissueGroups[L.key].position.y!==0||(state.explode&&L.key==='reticular');
    if(!show||!visGroups[INFO[L.key].g].visible){el.hidden=true;return;}
    const y=(L.top(HX,HZ)+L.bot(HX,HZ))/2+tissueGroups[L.key].position.y;
    const p=project(new V(HX,y,HZ));el.hidden=false;el.style.left=p.x+'px';el.style.top=p.y+'px';
  });
  tickStory(now);
  const vh=app.clientHeight,vw=app.clientWidth,sheet=story.on?stSheet:(!info.hidden?info:null);
  const want=sheet?Math.min(sheet.offsetHeight*.5+8,vh*.3):0;
  if(Math.abs(want-viewOff)>.5){viewOff+=(want-viewOff)*.15;camera.setViewOffset(vw,vh,0,viewOff,vw,vh);}
  renderer.render(scene,camera);
}
let viewOff=0;
function resize(){const w=app.clientWidth,h=app.clientHeight;renderer.setSize(w,h,false);canvas.style.width=w+'px';canvas.style.height=h+'px';camera.aspect=w/h;camera.setViewOffset(w,h,0,viewOff,w,h);camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);

/* ---------------- 啟動 ---------------- */
setTimeout(()=>{
  try{
    buildTextures();buildLayers();buildHair();buildSweat();buildVessels();buildStructures();buildStory();buildShadow();buildPanels();buildLayerTags();
  }catch(err){$('#loading').textContent='模型建立失敗：'+err.message;console.error(err);return;}
  resize();
  const p=defaultPose();
  camera.position.copy(p.pos.clone().sub(p.tgt).applyAxisAngle(UP,-.9).multiplyScalar(1.5).add(p.tgt));
  controls.target.copy(p.tgt);
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){camera.position.copy(p.pos);}else flyPose(p.pos,p.tgt,1800);
  $('#loading').classList.add('done');
  requestAnimationFrame(tick);
},30);
})();
</script>
